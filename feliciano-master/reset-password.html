<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reset Password | Mixtape Kitchen</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Poppins',sans-serif; background:linear-gradient(135deg,#1a1a1a,#2d2418); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .card { background:#fff; border-radius:14px; padding:44px 36px; max-width:440px; width:100%; box-shadow:0 25px 70px rgba(0,0,0,.4); text-align:center; }
        h2 { font-family:'Great Vibes',cursive; font-size:38px; color:#c8a97e; font-weight:normal; margin-bottom:8px; line-height:1; }
        p.sub { color:#888; font-size:14px; margin-bottom:26px; }
        label { display:block; text-align:left; font-size:12px; font-weight:600; color:#555; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
        input { width:100%; height:48px; background:#faf8f4; border:1.5px solid #eee; border-radius:8px; padding:0 14px; font-size:15px; font-family:'Poppins',sans-serif; margin-bottom:16px; outline:none; transition:.2s; }
        input:focus { background:#fff; border-color:#c8a97e; }
        button { width:100%; height:48px; background:#c8a97e; color:#fff; border:none; border-radius:8px; font-family:'Poppins',sans-serif; font-size:14px; font-weight:600; cursor:pointer; transition:.25s; }
        button:hover { background:#b8956a; }
        button:disabled { opacity:.6; cursor:not-allowed; }
        .msg { padding:10px 12px; border-radius:6px; font-size:13px; margin-bottom:16px; display:none; font-family:'Poppins',sans-serif; }
        .msg.error { color:#c33; background:#fee; }
        .msg.success { color:#2e7d32; background:#e8f5e9; border:1px solid #c8e6c9; }
        .msg.show { display:block; }
        a.back { display:inline-block; margin-top:22px; font-size:13px; color:#999; text-decoration:none; }
        a.back:hover { color:#c8a97e; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Reset Password</h2>
        <p class="sub" id="subText">Enter your new password below.</p>

        <div class="msg error" id="msgBox"></div>

        <div id="formWrap">
            <label for="newPass">New Password</label>
            <input type="password" id="newPass" placeholder="Min 6 characters" minlength="6">

            <label for="confirmPass">Confirm Password</label>
            <input type="password" id="confirmPass" placeholder="Re-enter password">

            <button id="resetBtn">Reset Password</button>
        </div>

        <a href="login.html" class="back">← Back to login</a>
    </div>

    <script>
        const BACKEND_URL = "https://feliciano-master.onrender.com";

        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");
        const msgBox = document.getElementById("msgBox");
        const formWrap = document.getElementById("formWrap");

        function showMsg(text, type) {
            msgBox.textContent = text;
            msgBox.className = "msg " + type + " show";
        }

        if (!token) {
            showMsg("Invalid or missing reset link. Please request a new one.", "error");
            formWrap.style.display = "none";
        }

        document.getElementById("resetBtn").addEventListener("click", async () => {
            const newPass = document.getElementById("newPass").value;
            const confirmPass = document.getElementById("confirmPass").value;

            if (newPass.length < 6) return showMsg("Password must be at least 6 characters.", "error");
            if (newPass !== confirmPass) return showMsg("Passwords do not match.", "error");

            const btn = document.getElementById("resetBtn");
            btn.disabled = true;
            btn.textContent = "Resetting...";

            try {
                const res = await fetch(`${BACKEND_URL}/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, newPassword: newPass }),
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    showMsg("✅ Password reset! Redirecting to login...", "success");
                    setTimeout(() => window.location.href = "login.html", 1800);
                } else {
                    showMsg(data.error || "Could not reset password.", "error");
                    btn.disabled = false;
                    btn.textContent = "Reset Password";
                }
            } catch (err) {
                showMsg("Server error. Please try again.", "error");
                btn.disabled = false;
                btn.textContent = "Reset Password";
            }
        });
    </script>
</body>
</html>
