<!DOCTYPE html>
<html lang="en">

<head>
    <title>Sign Up | Mixtape Kitchen</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Great+Vibes&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/owl.theme.default.min.css">
    <link rel="stylesheet" href="css/magnific-popup.css">
    <link rel="stylesheet" href="css/aos.css">
    <link rel="stylesheet" href="css/ionicons.min.css">
    <link rel="stylesheet" href="css/flaticon.css">
    <link rel="stylesheet" href="css/icomoon.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Google Sign-In SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        .auth-section {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2418 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 15px;
        }

        .auth-card {
            background: #fff;
            border-radius: 10px;
            padding: 50px 40px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
        }

        .auth-card .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-card .brand-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #c8a97e;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 30px;
        }

        .auth-card h2 {
            font-family: "Great Vibes", cursive;
            font-size: 42px;
            color: #c8a97e;
            margin-bottom: 5px;
            font-weight: normal;
            line-height: 1;
        }

        .auth-card .sub {
            font-size: 14px;
            color: #888;
            margin-bottom: 0;
        }

        .auth-card label {
            font-weight: 600;
            color: #000;
            font-size: 14px;
        }

        .auth-card .form-control {
            height: 52px;
            font-size: 15px;
        }

        .auth-card .btn-primary {
            background: #c8a97e;
            border-color: #c8a97e;
            color: #fff;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: 500;
            width: 100%;
            border-radius: 2px;
        }

        .auth-card .btn-primary:hover {
            background: transparent;
            color: #c8a97e;
            border-color: #c8a97e;
        }

        .auth-card .switch {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }

        .auth-card .switch a {
            color: #c8a97e;
            font-weight: 600;
        }

        .auth-card .error-msg {
            display: none;
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 5px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .auth-card .error-msg.show {
            display: block;
        }

        .auth-card .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #999;
        }

        .auth-card .back-home:hover {
            color: #c8a97e;
        }

        /* ============================================================
           Social Login Buttons
           ============================================================ */
        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 26px 0 22px;
            color: #bbb;
            font-size: 13px;
            font-family: "Poppins", sans-serif;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #eee;
        }

        .auth-divider span {
            padding: 0 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 11px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            height: 52px;
            padding: 0 20px;
            border-radius: 8px;
            font-family: "Poppins", sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all .25s ease;
            text-decoration: none;
            border: 1.5px solid #e5e5e5;
            background: #fff;
            color: #333;
            margin-bottom: 12px;
        }

        .social-btn:hover {
            background: #f8f6f3;
            border-color: #c8a97e;
            color: #1a1a1a;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 0, 0, .06);
        }

        .social-btn svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .social-btn .icon-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            font-size: 18px;
        }

        .social-btn.google .icon-box {
            color: #4285F4;
        }

        .social-btn.phone .icon-box {
            color: #c8a97e;
        }

        /* Hidden Google SDK container (used only for the popup) */
        #googleSignInBtn {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }

        /* ============================================================
           Phone login modal
           ============================================================ */
        .phone-modal {
            position: fixed;
            inset: 0;
            background: rgba(17, 17, 17, 0.75);
            backdrop-filter: blur(6px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .phone-modal.active {
            display: flex;
        }

        .phone-card {
            background: #fff;
            border-radius: 14px;
            padding: 36px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 25px 70px rgba(0, 0, 0, .4);
            position: relative;
            animation: popIn .3s ease both;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(.94);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .phone-card h3 {
            font-family: "Great Vibes", cursive;
            font-size: 34px;
            color: #c8a97e;
            font-weight: normal;
            line-height: 1;
            margin-bottom: 6px;
        }

        .phone-card p {
            color: #888;
            font-size: 13px;
            margin-bottom: 22px;
            font-family: "Poppins", sans-serif;
        }

        .phone-card .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: transparent;
            border: none;
            font-size: 22px;
            color: #bbb;
            cursor: pointer;
            line-height: 1;
        }

        .phone-card .close-btn:hover {
            color: #c8a97e;
        }

        .phone-card label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: block;
        }

        .phone-card .form-control {
            height: 48px;
            background: #faf8f4;
            border: 1.5px solid #eee;
            border-radius: 8px;
            font-size: 15px;
            padding: 0 14px;
            width: 100%;
            margin-bottom: 14px;
            font-family: "Poppins", sans-serif;
            outline: none;
            transition: all .2s;
        }

        .phone-card .form-control:focus {
            background: #fff;
            border-color: #c8a97e;
        }

        .phone-card .btn-send {
            width: 100%;
            height: 48px;
            background: #c8a97e;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: "Poppins", sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all .25s;
        }

        .phone-card .btn-send:hover {
            background: #b8956a;
            transform: translateY(-1px);
        }

        .phone-card .btn-send:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .phone-error {
            color: #c33;
            background: #fee;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 14px;
            display: none;
            font-family: "Poppins", sans-serif;
        }

        .phone-error.show {
            display: block;
        }

        @media (max-width: 576px) {
            .auth-card {
                padding: 35px 25px;
            }

            .auth-card h2 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

    <section class="auth-section">
        <div class="auth-card">

            <div class="brand">
                <div class="brand-icon">
                    <span class="icon-music-tone"></span>
                </div>
                <h2>Mixtape Kitchen</h2>
                <p class="sub">Create your account</p>
            </div>

            <div class="error-msg" id="errorBox"></div>

            <!-- ✅ Custom Google button -->
            <button type="button" class="social-btn google" id="customGoogleBtn">
                <span class="icon-box">
                    <svg viewBox="0 0 48 48" width="20" height="20">
                        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                    </svg>
                </span>
                Continue with Google
            </button>

            <!-- Phone login button -->
            <button type="button" class="social-btn phone" id="phoneLoginBtn">
                <span class="icon-box ion-ios-telephone"></span>
                Continue with Phone
            </button>

            <div class="auth-divider"><span>or</span></div>

            <!-- Email signup form -->
            <form id="signupForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required
                        minlength="6">
                </div>
                <div class="form-group text-center mt-4">
                    <button type="submit" class="btn btn-primary py-3 px-4" id="submitBtn">
                        Create Account
                    </button>
                </div>
            </form>

            <p class="switch">Already registered? <a href="login.html">Sign in</a></p>
            <a href="index.html" class="back-home">&larr; Back to home</a>

        </div>
    </section>

    <!-- Hidden Google SDK container -->
    <div id="googleSignInBtn"></div>

    <!-- ============================================================
         Phone login modal
         ============================================================ -->
    <div class="phone-modal" id="phoneModal">
        <div class="phone-card">
            <button class="close-btn" id="phoneClose" aria-label="Close">×</button>
            <h3>Continue with Phone</h3>
            <p>Enter your phone number. We'll send a verification code.</p>

            <div class="phone-error" id="phoneError"></div>

            <label for="phoneInput">Phone Number</label>
            <input type="tel" id="phoneInput" class="form-control" placeholder="+91 98765 43210" autocomplete="tel">

            <button type="button" class="btn-send" id="phoneSendOtp">
                Send OTP
            </button>

            <div id="otpSection" style="display:none; margin-top:20px;">
                <label for="otpInput">Enter OTP</label>
                <input type="text" id="otpInput" class="form-control" placeholder="6-digit code" maxlength="6"
                    inputmode="numeric">

                <button type="button" class="btn-send" id="phoneVerifyOtp">
                    Verify & Continue
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================================
         SCRIPTS
         ============================================================ -->
    <script>
        // ============================================================
        // CONFIG
        // ============================================================
        const BACKEND_URL = "https://feliciano-master.onrender.com";
        const GOOGLE_CLIENT_ID = "69969918808-rs9in68mueshi3h9o95e1k7ekvnsjhbr.apps.googleusercontent.com";

        // ============================================================
        // WARM UP BACKEND
        // ============================================================
        fetch(`${BACKEND_URL}/`)
            .then(r => r.json())
            .then(() => console.log("Backend is warm"))
            .catch(() => console.log("Backend cold"));

        // ============================================================
        // HELPERS
        // ============================================================
        const errorBox = document.getElementById("errorBox");
        let navigating = false;

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.classList.add("show");
        }

        function redirectAfterAuth() {
            const backTo = sessionStorage.getItem("lg_return_to") || "/";
            sessionStorage.removeItem("lg_return_to");
            setTimeout(() => { window.location.href = backTo; }, 100);
        }

        function completeLogin(data) {
            navigating = true;
            localStorage.removeItem("cart");
            localStorage.setItem("token", data.token);
            localStorage.setItem("user", JSON.stringify(data.user));

            const badge = document.getElementById("nav-cart-count");
            if (badge) {
                badge.textContent = "0";
                badge.setAttribute("data-count", "0");
            }

            redirectAfterAuth();
        }

        // ============================================================
        // EMAIL SIGNUP
        // ============================================================
        const form = document.getElementById("signupForm");
        const submitBtn = document.getElementById("submitBtn");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorBox.classList.remove("show");
            submitBtn.disabled = true;
            submitBtn.textContent = "Connecting...";

            try {
                await fetch(`${BACKEND_URL}/`, { method: "GET" }).catch(() => {});
                submitBtn.textContent = "Creating...";

                const res = await fetch(`${BACKEND_URL}/signup`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        name: document.getElementById("name").value.trim(),
                        email: document.getElementById("email").value.trim(),
                        password: document.getElementById("password").value,
                    }),
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    completeLogin(data);
                    return;
                }

                showError(data.error || "Signup failed");
                submitBtn.disabled = false;
                submitBtn.textContent = "Create Account";

            } catch (err) {
                if (navigating) return;
                console.error(err);
                showError("Server is waking up. Please wait a few seconds and try again.");
                submitBtn.disabled = false;
                submitBtn.textContent = "Create Account";
            }
        });

        // ============================================================
        // GOOGLE SIGN-IN
        // ============================================================
        window.handleCredentialResponse = async function (response) {
            try {
                const payload = JSON.parse(atob(response.credential.split(".")[1]));
                const { email, name, picture, sub } = payload;

                console.log("Google user:", { email, name, sub });

                const res = await fetch(`${BACKEND_URL}/google-login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: email,
                        name: name,
                        googleId: sub,
                        picture: picture,
                    }),
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    completeLogin(data);
                } else {
                    showError(data.error || "Google login failed");
                }
            } catch (err) {
                console.error("Google login error:", err);
                showError("Google login failed. Please try email signup instead.");
            }
        };

        // Initialize Google Sign-In
        window.addEventListener("load", () => {
            if (typeof google === "undefined" || !google.accounts) {
                console.warn("Google SDK not loaded");
                return;
            }

            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleCredentialResponse,
                auto_select: false,
                cancel_on_tap_outside: true,
            });

            // Render the hidden Google button (needed to use the SDK)
            google.accounts.id.renderButton(
                document.getElementById("googleSignInBtn"),
                {
                    theme: "outline",
                    size: "large",
                    text: "continue_with",
                    shape: "rectangular",
                    logo_alignment: "left",
                }
            );

            // Wire up our custom button to trigger the Google flow
            const customBtn = document.getElementById("customGoogleBtn");
            if (customBtn) {
                customBtn.addEventListener("click", () => {
                    // Click the hidden Google button
                    const hiddenBtn = document.querySelector("#googleSignInBtn div[role='button']");
                    if (hiddenBtn) {
                        hiddenBtn.click();
                    } else {
                        // Fallback — trigger the One Tap prompt
                        google.accounts.id.prompt();
                    }
                });
            }
        });

        // ============================================================
        // PHONE LOGIN
        // ============================================================
        const phoneModal = document.getElementById("phoneModal");
        const phoneClose = document.getElementById("phoneClose");
        const phoneInput = document.getElementById("phoneInput");
        const phoneErrorBox = document.getElementById("phoneError");
        const phoneSendOtp = document.getElementById("phoneSendOtp");
        const otpSection = document.getElementById("otpSection");
        const otpInput = document.getElementById("otpInput");
        const phoneVerifyOtp = document.getElementById("phoneVerifyOtp");

        document.getElementById("phoneLoginBtn").addEventListener("click", () => {
            phoneModal.classList.add("active");
        });
        phoneClose.addEventListener("click", () => {
            phoneModal.classList.remove("active");
            phoneErrorBox.classList.remove("show");
            otpSection.style.display = "none";
            phoneInput.value = "";
            otpInput.value = "";
        });

        function showPhoneError(msg) {
            phoneErrorBox.textContent = msg;
            phoneErrorBox.classList.add("show");
        }

        phoneSendOtp.addEventListener("click", async () => {
            phoneErrorBox.classList.remove("show");
            const phone = phoneInput.value.trim();

            if (!phone || phone.length < 8) {
                showPhoneError("Please enter a valid phone number.");
                return;
            }

            phoneSendOtp.disabled = true;
            phoneSendOtp.textContent = "Sending...";

            try {
                const res = await fetch(`${BACKEND_URL}/phone-send-otp`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone }),
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    otpSection.style.display = "block";
                    phoneSendOtp.textContent = "OTP Sent";
                } else {
                    showPhoneError(data.error || "Could not send OTP.");
                    phoneSendOtp.disabled = false;
                    phoneSendOtp.textContent = "Send OTP";
                }
            } catch (err) {
                showPhoneError("Server is waking up. Please try again.");
                phoneSendOtp.disabled = false;
                phoneSendOtp.textContent = "Send OTP";
            }
        });

        phoneVerifyOtp.addEventListener("click", async () => {
            phoneErrorBox.classList.remove("show");
            const phone = phoneInput.value.trim();
            const otp = otpInput.value.trim();

            if (!otp || otp.length !== 6) {
                showPhoneError("Please enter the 6-digit code.");
                return;
            }

            phoneVerifyOtp.disabled = true;
            phoneVerifyOtp.textContent = "Verifying...";

            try {
                const res = await fetch(`${BACKEND_URL}/phone-verify-otp`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ phone, otp }),
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    completeLogin(data);
                } else {
                    showPhoneError(data.error || "Invalid OTP.");
                    phoneVerifyOtp.disabled = false;
                    phoneVerifyOtp.textContent = "Verify & Continue";
                }
            } catch (err) {
                showPhoneError("Server error. Please try again.");
                phoneVerifyOtp.disabled = false;
                phoneVerifyOtp.textContent = "Verify & Continue";
            }
        });
    </script>

</body>

</html>
