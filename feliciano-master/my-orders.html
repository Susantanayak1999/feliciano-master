<!DOCTYPE html>
<html lang="en">

<head>
    <title>My Orders | Mixtape Kitchen</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/owl.theme.default.min.css">
    <link rel="stylesheet" href="css/magnific-popup.css">
    <link rel="stylesheet" href="css/aos.css">
    <link rel="stylesheet" href="css/ionicons.min.css">
    <link rel="stylesheet" href="css/flaticon.css">
    <link rel="stylesheet" href="css/icomoon.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        :root {
            --veg: #2e7d32;
            --nonveg: #b71c1c;
            --gold: #c8a97e;
            --bg-color: #f7f5f0;
        }

        body {
            background-color: var(--bg-color);
        }

        /* ===== HERO SECTION ===== */
        .orders-hero {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2418 100%);
            padding: 80px 20px 60px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .orders-hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(200,169,126,0.15), transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(200,169,126,0.1), transparent 50%);
            pointer-events: none;
        }
        .orders-hero .mo-eyebrow {
            color: var(--gold);
            font-family: "Great Vibes", cursive;
            font-size: 36px;
            display: block;
            margin-bottom: 8px;
            position: relative;
        }
        .orders-hero h1 {
            color: #fff;
            font-family: "Poppins", sans-serif;
            font-size: 46px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 14px;
            position: relative;
            text-transform: uppercase;
        }
        .orders-hero p {
            color: rgba(255,255,255,0.6);
            font-size: 15px;
            max-width: 520px;
            margin: 0 auto;
            position: relative;
            font-family: "Poppins", sans-serif;
        }

        /* ===== MAIN SECTION ===== */
        .orders-section {
            padding: 50px 7% 100px;
            min-height: 500px;
            margin-top: -30px; /* Overlaps the hero slightly */
            position: relative;
            z-index: 10;
        }
        .orders-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* ===== LOADING & EMPTY STATES ===== */
        .orders-loading {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            font-family: "Poppins", sans-serif;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
        }
        .orders-loading .spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(200,169,126,0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            margin: 0 auto 18px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .orders-empty {
            text-align: center;
            padding: 80px 20px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
        }
        .orders-empty .icon {
            font-size: 70px;
            color: #e8d9be;
            margin-bottom: 25px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-15px); }
        }
        .orders-empty h3 {
            font-family: "Poppins", sans-serif;
            font-size: 26px;
            color: #1a1a1a;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .orders-empty p {
            color: #888;
            font-size: 15px;
            margin-bottom: 30px;
        }
        .orders-empty .btn-menu {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 36px;
            background: linear-gradient(135deg, var(--gold), #b18f64);
            color: #fff;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(200,169,126,0.4);
            transition: all 0.3s;
        }
        .orders-empty .btn-menu:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(200,169,126,0.6);
        }

        /* ===== ORDER CARD REDESIGN ===== */
        .order-card {
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.04);
            border: 1px solid rgba(200,169,126,0.1);
            animation: fadeUp 0.5s ease both;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .order-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 60px rgba(200,169,126,0.12);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        
        /* Gold accent line on the left */
        .order-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 6px;
            background: linear-gradient(to bottom, var(--gold), #b18f64);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: 20px;
            border-bottom: 1px dashed #eee;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .order-header .left h4 {
            font-family: "Poppins", sans-serif;
            font-size: 18px;
            color: #1a1a1a;
            margin: 0 0 6px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .order-header .left .order-id {
            font-size: 13px;
            color: #999;
            font-family: monospace;
            word-break: break-all;
            background: #f9f9f9;
            padding: 4px 10px;
            border-radius: 6px;
            display: inline-block;
        }
        .order-header .right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }
        .order-header .total {
            font-family: "Poppins", sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: var(--gold);
            line-height: 1;
        }

        /* ===== TIMELINE TRACKER ===== */
        .order-timeline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding: 0 10px;
            position: relative;
        }
        .timeline-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 2;
            width: 80px;
        }
        .timeline-icon {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: #f0f0f0;
            color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.4s ease;
        }
        .timeline-step.active .timeline-icon {
            background: var(--gold);
            color: #fff;
            box-shadow: 0 4px 15px rgba(200,169,126,0.4);
        }
        .timeline-step.cancelled .timeline-icon {
            background: #ffebee;
            color: #c62828;
        }
        .timeline-step span {
            font-size: 11px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .timeline-step.active span {
            color: var(--gold);
        }
        .timeline-line {
            flex: 1;
            height: 3px;
            background: #f0f0f0;
            margin-top: -20px;
            z-index: 1;
            position: relative;
        }
        .timeline-line.active {
            background: var(--gold);
        }
        
        /* ===== STATUS BADGES ===== */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .status-badge i { font-size: 14px; }
        
        .status-badge.Confirmed { background: #e3f2fd; color: #1976d2; }
        .status-badge.Preparing { background: #fff3e0; color: #f57c00; animation: pulse-badge 2s infinite; }
        .status-badge.Delivered { background: #e8f5e9; color: #2e7d32; }
        .status-badge.Cancelled { background: #ffebee; color: #c62828; }

        @keyframes pulse-badge {
            0% { box-shadow: 0 0 0 0 rgba(245, 124, 0, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(245, 124, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 124, 0, 0); }
        }

        /* ===== ORDER ITEMS ===== */
        .order-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            background: #faf9f7;
            padding: 18px;
            border-radius: 12px;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            font-family: "Poppins", sans-serif;
            font-size: 14.5px;
            color: #444;
        }
        .order-item .info {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .order-img-wrap {
            position: relative;
            flex-shrink: 0;
        }
        .order-img-wrap img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .order-img-wrap .type-dot {
            position: absolute;
            top: -4px; left: -4px;
            width: 16px; height: 16px;
            border-radius: 4px;
            background: #fff;
            border: 1.5px solid var(--veg);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .order-img-wrap .type-dot::after {
            content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--veg);
        }
        .order-img-wrap .type-dot.nonveg { border-color: var(--nonveg); }
        .order-img-wrap .type-dot.nonveg::after { background: var(--nonveg); }

        .order-item .name {
            color: #1a1a1a;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 15px;
        }
        .order-item .qty {
            color: #888;
            font-size: 12.5px;
            margin-top: 2px;
        }
        .order-item .line-total {
            color: #1a1a1a;
            font-weight: 700;
            flex-shrink: 0;
            font-size: 15px;
        }

        /* ===== ORDER FOOTER ===== */
        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px dashed #eee;
            font-size: 12.5px;
            color: #888;
            flex-wrap: wrap;
            gap: 10px;
        }
        .order-footer span { display: flex; align-items: center; gap: 6px; }
        .order-footer i { color: var(--gold); }
        .order-footer .payment-id {
            font-family: monospace;
            background: #f5f5f5;
            padding: 4px 8px;
            border-radius: 6px;
            color: #555;
        }

        /* ===== TOAST NOTIFICATION ===== */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .custom-toast {
            background: #fff;
            border-radius: 16px;
            padding: 18px 22px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            border-left: 6px solid var(--gold);
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 340px;
            max-width: 420px;
            transform: translateX(120%);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .custom-toast.show { transform: translateX(0); }
        .custom-toast .icon {
            width: 48px; height: 48px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 22px;
            flex-shrink: 0;
        }
        .custom-toast .toast-text h4 {
            font-size: 15px; color: #1a1a1a; margin-bottom: 3px; font-weight: 700;
        }
        .custom-toast .toast-text p {
            font-size: 13px; color: #666; margin: 0; line-height: 1.4;
        }

        .orders-error {
            background: #fee;
            color: #c33;
            padding: 24px;
            border-radius: 16px;
            font-size: 15px;
            text-align: center;
            font-weight: 500;
        }

        /* ===== MOBILE RESPONSIVE ===== */
        @media (max-width: 768px) {
            .orders-hero { padding: 60px 20px 50px; }
            .orders-hero h1 { font-size: 34px; }
            .orders-hero .mo-eyebrow { font-size: 28px; }
            .orders-section { padding: 30px 5% 80px; margin-top: -20px;}
            .order-card { padding: 22px; border-radius: 16px; }
            .order-header { flex-direction: column; }
            .order-header .right { align-items: flex-start; text-align: left; width: 100%; flex-direction: row; justify-content: space-between;}
            .order-header .total { font-size: 22px; }
            
            /* Timeline mobile adjustments */
            .order-timeline { padding: 0; }
            .timeline-icon { width: 34px; height: 34px; font-size: 14px; }
            .timeline-step span { font-size: 9.5px; }
            .timeline-line { margin-top: -17px; }
            
            .order-items { padding: 14px; gap: 10px; }
            .order-item { font-size: 13.5px; }
            .order-img-wrap img { width: 44px; height: 44px; }
            
            .toast-container { bottom: 20px; right: 20px; left: 20px; }
            .custom-toast { min-width: auto; width: 100%; padding: 16px; }
        }
    </style>
</head>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/jquery.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.easing.1.3.js"></script>
    <script src="js/jquery.waypoints.min.js"></script>
    <script src="js/jquery.stellar.min.js"></script>
    <script src="js/owl.carousel.min.js"></script>
    <script src="js/aos.js"></script>
    <script src="js/jquery.animateNumber.min.js"></script>
    <script src="js/scrollax.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart-badge.js"></script>
    <script src="js/auth-nav.js"></script>
    <script src="js/login-gate.js"></script>

    <script>
        const BACKEND_URL = "https://feliciano-master.onrender.com";

        const loadingEl = document.getElementById("ordersLoading");
        const listEl    = document.getElementById("ordersList");
        const emptyEl   = document.getElementById("ordersEmpty");
        const errorEl   = document.getElementById("ordersError");

        let previousStatuses = {}; 
        let isFirstLoad = true;    

        function showError(msg) {
            loadingEl.style.display = "none";
            listEl.innerHTML = "";
            emptyEl.style.display = "none";
            errorEl.textContent = msg;
            errorEl.style.display = "block";
        }

        function escapeHtml(s) {
            return String(s || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function formatDate(iso) {
            try {
                const d = new Date(iso);
                return d.toLocaleString("en-IN", {
                    day: "2-digit", month: "short", year: "numeric",
                    hour: "2-digit", minute: "2-digit"
                });
            } catch { return iso; }
        }

        // ============================================
        // POPUP NOTIFICATION
        // ============================================
        function showNotification(title, message, status) {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            toast.className = "custom-toast";
            
            let icon = "fa-info-circle";
            let color = "#1976d2"; // Blue 
            
            if (status === "Preparing") { icon = "fa-fire"; color = "#f57c00"; } // Orange
            if (status === "Delivered") { icon = "fa-check-circle"; color = "#2e7d32"; } // Green
            if (status === "Cancelled") { icon = "fa-times-circle"; color = "#c62828"; } // Red

            toast.style.borderLeftColor = color;
            
            toast.innerHTML = `
                <div class="icon" style="color:${color}; background:${color}1A;">
                    <i class="fas ${icon}"></i>
                </div>
                <div class="toast-text">
                    <h4>${title}</h4>
                    <p>${message}</p>
                </div>
            `;
            
            container.appendChild(toast);

            setTimeout(() => toast.classList.add("show"), 100);

            setTimeout(() => {
                toast.classList.remove("show");
                setTimeout(() => toast.remove(), 400);
            }, 6000);

            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, { body: message, icon: "images/default-food.jpg" });
            }
        }

        // ============================================
        // RENDER ORDERS (WITH TIMELINE TRACKER)
        // ============================================
        function renderOrders(orders) {
            loadingEl.style.display = "none";

            if (!orders || orders.length === 0) {
                emptyEl.style.display = "block";
                return;
            }
            emptyEl.style.display = "none";

            listEl.innerHTML = orders.map((order, i) => {
                const items = order.items || [];
                const itemsHtml = items.map(item => {
                    const lineTotal = Number(item.price) * Number(item.quantity);
                    const isNonVeg = item.type === "non-veg";
                    const typeClass = isNonVeg ? "nonveg" : "";

                    return `
                        <div class="order-item">
                            <div class="info">
                                <div class="order-img-wrap">
                                    <img src="${escapeHtml(item.image || 'images/default-food.jpg')}"
                                         alt="${escapeHtml(item.name)}"
                                         onerror="this.src='https://via.placeholder.com/50x50/c8a97e/ffffff?text=F'">
                                    <span class="type-dot ${typeClass}"></span>
                                </div>
                                <div>
                                    <div class="name">${escapeHtml(item.name)}</div>
                                    <div class="qty">Qty: ${item.quantity} × ₹${Number(item.price).toFixed(2)}</div>
                                </div>
                            </div>
                            <div class="line-total">₹${lineTotal.toFixed(2)}</div>
                        </div>
                    `;
                }).join("");

                const currentStatus = order.status || "Confirmed";
                
                // Timeline Logic
                const isPreparing = currentStatus === "Preparing";
                const isDelivered = currentStatus === "Delivered";
                const isCancelled = currentStatus === "Cancelled";
                
                let step1Class = "active"; // Confirmed is always active
                let step2Class = isPreparing || isDelivered ? "active" : "";
                let step3Class = isDelivered ? "active" : "";
                
                let line1Class = isPreparing || isDelivered ? "active" : "";
                let line2Class = isDelivered ? "active" : "";

                return `
                    <div class="order-card" style="animation-delay:${i * 0.1}s;">
                        <div class="order-header">
                            <div class="left">
                                <h4>Order #${escapeHtml(String(order._id || order.orderId || "").slice(-8).toUpperCase())}</h4>
                                <div class="order-id">${escapeHtml(order.orderId || "")}</div>
                            </div>
                            <div class="right">
                                <div class="total">₹${Number(order.amount || 0).toFixed(2)}</div>
                                <span class="status-badge ${currentStatus}">
                                    ${currentStatus}
                                </span>
                            </div>
                        </div>

                        ${!isCancelled ? `
                        <div class="order-timeline">
                            <div class="timeline-step ${step1Class}">
                                <div class="timeline-icon"><i class="fas fa-receipt"></i></div>
                                <span>Confirmed</span>
                            </div>
                            <div class="timeline-line ${line1Class}"></div>
                            
                            <div class="timeline-step ${step2Class}">
                                <div class="timeline-icon"><i class="fas fa-fire"></i></div>
                                <span>Preparing</span>
                            </div>
                            <div class="timeline-line ${line2Class}"></div>
                            
                            <div class="timeline-step ${step3Class}">
                                <div class="timeline-icon"><i class="fas fa-check"></i></div>
                                <span>Delivered</span>
                            </div>
                        </div>
                        ` : `
                        <div class="order-timeline" style="justify-content:center;">
                            <div class="timeline-step cancelled">
                                <div class="timeline-icon"><i class="fas fa-times"></i></div>
                                <span>Order Cancelled</span>
                            </div>
                        </div>
                        `}

                        <div class="order-items">${itemsHtml || '<div style="color:#999;font-size:13px;">No items recorded</div>'}</div>

                        <div class="order-footer">
                            <span><i class="far fa-calendar-alt"></i> ${formatDate(order.createdAt)}</span>
                            <span class="payment-id">Payment: ${escapeHtml(order.paymentId || "—")}</span>
                        </div>
                    </div>
                `;
            }).join("");
        }

        // ============================================
        // LOAD ORDERS & POLLING LOGIC
        // ============================================
        async function loadOrders(isPolling = false) {
            const token = localStorage.getItem("token");
            if (!token) {
                if (!isPolling) {
                    sessionStorage.setItem("lg_return_to", "/my-orders.html");
                    window.location.href = "login.html";
                }
                return;
            }

            try {
                const res = await fetch(`${BACKEND_URL}/my-orders`, {
                    headers: { "Authorization": "Bearer " + token },
                });

                const data = await res.json();

                if (res.status === 401) {
                    if (!isPolling) {
                        localStorage.removeItem("token");
                        localStorage.removeItem("user");
                        sessionStorage.setItem("lg_return_to", "/my-orders.html");
                        window.location.href = "login.html";
                    }
                    return;
                }

                if (!res.ok || !data.success) {
                    if (!isPolling) showError(data.error || "Could not load orders.");
                    return;
                }

                const orders = data.orders || [];
                let hasStatusChanged = false; 

                if (!isFirstLoad) {
                    orders.forEach(order => {
                        const oldStatus = previousStatuses[order._id];
                        const newStatus = order.status || "Confirmed";

                        if (oldStatus && oldStatus !== newStatus) {
                            
                            // Trigger the popup
                            if (newStatus === "Preparing") {
                                showNotification("Order is Preparing! 👨‍🍳", `Your order #${order._id.slice(-6).toUpperCase()} is now in the kitchen.`, newStatus);
                            }
                            if (newStatus === "Delivered") {
                                showNotification("Order Delivered! 🎉", `Enjoy your meal! Order #${order._id.slice(-6).toUpperCase()} has arrived.`, newStatus);
                            }
                            if (newStatus === "Cancelled") {
                                showNotification("Order Cancelled ❌", `Order #${order._id.slice(-6).toUpperCase()} was cancelled.`, newStatus);
                            }
                            
                            hasStatusChanged = true; 
                        }
                        previousStatuses[order._id] = newStatus;
                    });
                    
                    // THE FIX: Re-render everything if a change was detected. 
                    // This forces the HTML to redraw with the correct badge and timeline.
                    if (hasStatusChanged) {
                        renderOrders(orders);
                    }

                } else {
                    // First load: Save statuses silently
                    orders.forEach(order => {
                        previousStatuses[order._id] = order.status || "Confirmed";
                    });
                    isFirstLoad = false;
                    renderOrders(orders);
                }

            } catch (err) {
                if (!isPolling) {
                    console.error("Load orders error:", err);
                    showError("Server is waking up. Please refresh in a moment.");
                }
            }
        }

        // ============================================
        // INIT
        // ============================================
        document.addEventListener("DOMContentLoaded", () => {
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }

            loadOrders(false);

            // Check for updates every 5 seconds
            setInterval(() => {
                loadOrders(true);
            }, 5000); 
        });
    </script>

</body>
</html>
