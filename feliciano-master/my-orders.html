<!DOCTYPE html>
<html lang="en">

<head>
    <title>My Orders | Mixtape Kitchen</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/owl.carousel.min.css">
    <link rel="stylesheet" href="css/owl.theme.default.min.css">
    <link rel="stylesheet" href="css/magnific-popup.css">
    <link rel="stylesheet" href="css/aos.css">
    <link rel="stylesheet" href="css/ionicons.min.css">
    <link rel="stylesheet" href="css/flaticon.css">
    <link rel="stylesheet" href="css/icomoon.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        :root {
            --veg: #2e7d32;
            --nonveg: #b71c1c;
        }

        .orders-hero {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2418 100%);
            padding: 70px 20px 50px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .orders-hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(200,169,126,0.12), transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(200,169,126,0.08), transparent 50%);
            pointer-events: none;
        }
        .orders-hero .mo-eyebrow {
            color: #c8a97e;
            font-family: "Great Vibes", cursive;
            font-size: 32px;
            display: block;
            margin-bottom: 6px;
            position: relative;
        }
        .orders-hero h1 {
            color: #fff;
            font-family: "Poppins", sans-serif;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 12px;
            position: relative;
        }
        .orders-hero p {
            color: rgba(255,255,255,0.7);
            font-size: 15px;
            max-width: 520px;
            margin: 0 auto;
            position: relative;
            font-family: "Poppins", sans-serif;
        }
        .orders-hero .divider {
            width: 70px;
            height: 3px;
            background: #c8a97e;
            margin: 18px auto 0;
            border-radius: 3px;
            position: relative;
        }

        .orders-section {
            background: #f8f6f3;
            padding: 60px 7% 90px;
            min-height: 500px;
        }
        .orders-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .orders-loading {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            font-family: "Poppins", sans-serif;
        }
        .orders-loading .spinner {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid rgba(200,169,126,0.2);
            border-top-color: #c8a97e;
            margin: 0 auto 18px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .orders-empty {
            text-align: center;
            padding: 70px 20px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 45px rgba(0,0,0,0.05);
            border: 1px solid rgba(200,169,126,0.12);
        }
        .orders-empty .icon {
            font-size: 60px;
            color: #e8d9be;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }
        .orders-empty h3 {
            font-family: "Poppins", sans-serif;
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .orders-empty p {
            color: #888;
            font-size: 15px;
            margin-bottom: 26px;
            font-family: "Poppins", sans-serif;
        }
        .orders-empty .btn-menu {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: linear-gradient(135deg, #c8a97e, #b18f64);
            color: #fff;
            border-radius: 30px;
            font-family: "Poppins", sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(200,169,126,0.35);
            transition: all 0.3s;
        }
        .orders-empty .btn-menu:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(200,169,126,0.5);
            color: #fff;
        }

        .order-card {
            background: #fff;
            border-radius: 16px;
            padding: 26px 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            border: 1px solid rgba(200,169,126,0.15);
            animation: fadeUp 0.5s ease both;
            transition: box-shadow 0.3s;
        }
        .order-card:hover {
            box-shadow: 0 15px 50px rgba(200,169,126,0.15);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: 16px;
            border-bottom: 1px dashed rgba(200,169,126,0.3);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .order-header .left h4 {
            font-family: "Poppins", sans-serif;
            font-size: 15px;
            color: #1a1a1a;
            margin: 0 0 4px;
            font-weight: 600;
        }
        .order-header .left .order-id {
            font-size: 12px;
            color: #999;
            font-family: monospace;
            word-break: break-all;
        }
        .order-header .right {
            text-align: right;
        }
        .order-header .total {
            font-family: "Poppins", sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: #c8a97e;
            line-height: 1;
        }
        
        /* ============================================================
           DYNAMIC STATUS BADGE COLORS
           ============================================================ */
        .order-header .status {
            display: inline-block;
            margin-top: 6px;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        
        /* Base default style */
        .status { background: #f5f5f5; color: #333; }
        
        /* Force colors by checking the data attribute */
        .status[data-status="Confirmed"], .status[data-status="confirmed"] { background: #e3f2fd; color: #1976d2; }
        .status[data-status="Preparing"], .status[data-status="preparing"] { background: #fff3e0; color: #f57c00; }
        .status[data-status="Delivered"], .status[data-status="delivered"] { background: #e8f5e9; color: #2e7d32; }
        .status[data-status="Cancelled"], .status[data-status="cancelled"] { background: #ffebee; color: #c62828; }

        .order-items {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            font-family: "Poppins", sans-serif;
            font-size: 14px;
            color: #444;
        }
        .order-item .info {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .order-img-wrap {
            position: relative;
            flex-shrink: 0;
        }
        .order-img-wrap img {
            width: 46px;
            height: 46px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }
        .order-img-wrap .type-dot {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 12px;
            height: 12px;
            border-radius: 3px;
            background: #fff;
            border: 1.2px solid var(--veg);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.18);
        }
        .order-img-wrap .type-dot::after {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--veg);
        }
        .order-img-wrap .type-dot.nonveg { border-color: var(--nonveg); }
        .order-img-wrap .type-dot.nonveg::after { background: var(--nonveg); }

        .order-item .name {
            color: #1a1a1a;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .order-item .qty {
            color: #999;
            font-size: 12px;
        }

        /* Veg / Non-veg inline badge */
        .type-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 8px;
            border-radius: 20px;
            font-family: "Poppins", sans-serif;
            font-size: 10px;
            font-weight: 600;
            background: rgba(46, 125, 50, 0.1);
            color: var(--veg);
            margin-right: 6px;
        }
        .type-badge .dot {
            width: 8px;
            height: 8px;
            border: 1.4px solid var(--veg);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
        }
        .type-badge .dot::after {
            content: "";
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--veg);
        }
        .type-badge.nonveg {
            background: rgba(183, 28, 28, 0.1);
            color: var(--nonveg);
        }
        .type-badge.nonveg .dot { border-color: var(--nonveg); }
        .type-badge.nonveg .dot::after { background: var(--nonveg); }

        .order-item .line-total {
            color: #c8a97e;
            font-weight: 600;
            flex-shrink: 0;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px dashed #eee;
            font-size: 12px;
            color: #999;
            font-family: "Poppins", sans-serif;
            flex-wrap: wrap;
            gap: 10px;
        }
        .order-footer .payment-id {
            font-family: monospace;
            word-break: break-all;
        }

        .orders-error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 12px;
            font-family: "Poppins", sans-serif;
            font-size: 14px;
            text-align: center;
        }

        /* ============================================================
           TOAST NOTIFICATION
           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .custom-toast {
            background: #fff;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-left: 5px solid #c8a97e;
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 320px;
            max-width: 400px;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .custom-toast.show { transform: translateX(0); }
        .custom-toast .icon {
            width: 42px; height: 42px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            flex-shrink: 0;
        }
        .custom-toast .toast-text h4 {
            font-size: 14px; color: #1a1a1a; margin-bottom: 2px; font-weight: 700;
        }
        .custom-toast .toast-text p {
            font-size: 12.5px; color: #666; margin: 0; line-height: 1.4;
        }

        @media (max-width: 600px) {
            .orders-hero { padding: 50px 20px 40px; }
            .orders-hero h1 { font-size: 32px; }
            .orders-hero .mo-eyebrow { font-size: 24px; }
            .orders-section { padding: 40px 5% 60px; }
            .order-card { padding: 20px; }
            .order-header .total { font-size: 18px; }
            .toast-container { bottom: 20px; right: 20px; left: 20px; }
            .custom-toast { min-width: auto; width: 100%; }
        }
    </style>
</head>

        <h1>My Orders</h1>

        <div class="divider"></div>
    </section>

    <section class="orders-section">
        <div class="orders-container">

            <div id="ordersLoading" class="orders-loading">
                <div class="spinner"></div>
                Loading your orders...
            </div>

            <div id="ordersList"></div>

            <div id="ordersEmpty" class="orders-empty" style="display:none;">
                <div class="icon"><span class="ion-ios-basket"></span></div>
                <h3>No orders yet</h3>
                <p>Looks like you haven't placed an order. Browse our menu to get started!</p>

                </a>

            <div id="ordersError" class="orders-error" style="display:none;"></div>

        </div>
    </section>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/jquery.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.easing.1.3.js"></script>
    <script src="js/jquery.waypoints.min.js"></script>
    <script src="js/jquery.stellar.min.js"></script>
    <script src="js/owl.carousel.min.js"></script>
    <script src="js/aos.js"></script>
    <script src="js/jquery.animateNumber.min.js"></script>
    <script src="js/scrollax.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart-badge.js"></script>
    <script src="js/auth-nav.js"></script>
    <script src="js/login-gate.js"></script>

    <script>
        // ============================================
        // CONFIG
        // ============================================
        const BACKEND_URL = "https://feliciano-master.onrender.com";

        const loadingEl = document.getElementById("ordersLoading");
        const listEl    = document.getElementById("ordersList");
        const emptyEl   = document.getElementById("ordersEmpty");
        const errorEl   = document.getElementById("ordersError");

        let previousStatuses = {}; // Keeps track of past statuses to detect changes
        let isFirstLoad = true;    // Prevents notifying on initial page load

        function showError(msg) {
            loadingEl.style.display = "none";
            listEl.innerHTML = "";
            emptyEl.style.display = "none";
            errorEl.textContent = msg;
            errorEl.style.display = "block";
        }

        function escapeHtml(s) {
            return String(s || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function formatDate(iso) {
            try {
                const d = new Date(iso);
                return d.toLocaleString("en-IN", {
                    day: "2-digit", month: "short", year: "numeric",
                    hour: "2-digit", minute: "2-digit"
                });
            } catch { return iso; }
        }

        // ============================================
        // POPUP NOTIFICATION FUNCTION
        // ============================================
        function showNotification(title, message, status) {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            toast.className = "custom-toast";
            
            let icon = "fa-info-circle";
            let color = "#1976d2"; // Blue (Confirmed)
            
            if (status === "Preparing") { icon = "fa-fire"; color = "#f57c00"; } // Orange
            if (status === "Delivered") { icon = "fa-check-circle"; color = "#2e7d32"; } // Green
            if (status === "Cancelled") { icon = "fa-times-circle"; color = "#c62828"; } // Red

            toast.style.borderLeftColor = color;
            
            toast.innerHTML = `
                <div class="icon" style="color:${color}; background:${color}1A;">
                    <i class="fas ${icon}"></i>
                </div>
                <div class="toast-text">
                    <h4>${title}</h4>
                    <p>${message}</p>
                </div>
            `;
            
            container.appendChild(toast);

            // Animate in
            setTimeout(() => toast.classList.add("show"), 100);

            // Remove after 6 seconds
            setTimeout(() => {
                toast.classList.remove("show");
                setTimeout(() => toast.remove(), 400);
            }, 6000);

            // Browser system notification (if allowed)
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(title, { body: message, icon: "images/default-food.jpg" });
            }
        }

        // ============================================
        // RENDER ORDERS
        // ============================================
        function renderOrders(orders) {
            loadingEl.style.display = "none";

            if (!orders || orders.length === 0) {
                emptyEl.style.display = "block";
                return;
            }
            emptyEl.style.display = "none";

            listEl.innerHTML = orders.map((order, i) => {
                const items = order.items || [];
                const itemsHtml = items.map(item => {
                    const lineTotal = Number(item.price) * Number(item.quantity);
                    const isNonVeg = item.type === "non-veg";
                    const typeLabel = isNonVeg ? "Non-Veg" : "Veg";
                    const typeClass = isNonVeg ? "nonveg" : "";

                    return `
                        <div class="order-item">
                            <div class="info">
                                <div class="order-img-wrap">
                                    <img src="${escapeHtml(item.image || 'images/default-food.jpg')}"
                                         alt="${escapeHtml(item.name)}"
                                         onerror="this.src='https://via.placeholder.com/46x46/c8a97e/ffffff?text=F'">
                                    <span class="type-dot ${typeClass}"></span>
                                </div>
                                <div>
                                    <span class="type-badge ${typeClass}">
                                        <span class="dot"></span> ${typeLabel}
                                    </span>
                                    <div class="name">${escapeHtml(item.name)}</div>
                                    <div class="qty">Qty: ${item.quantity} × ₹${Number(item.price).toFixed(2)}</div>
                                </div>
                            </div>
                            <div class="line-total">₹${lineTotal.toFixed(2)}</div>
                        </div>
                    `;
                }).join("");

                const currentStatus = order.status || "Confirmed";

                return `
                    <div class="order-card" style="animation-delay:${i * 0.06}s;">
                        <div class="order-header">
                            <div class="left">
                                <h4>Order #${escapeHtml(String(order._id || order.orderId || "").slice(-8).toUpperCase())}</h4>
                                <div class="order-id">${escapeHtml(order.orderId || "")}</div>
                            </div>
                            <div class="right">
                                <div class="total">₹${Number(order.amount || 0).toFixed(2)}</div>
                                <!-- We will target this data attribute for updates -->
                                <span class="status" data-status="${currentStatus}" data-order-id="${order._id}" id="status-badge-${order._id}">${currentStatus}</span>
                            </div>
                        </div>

                        <div class="order-items">${itemsHtml || '<div style="color:#999;font-size:13px;">No items recorded</div>'}</div>

                        <div class="order-footer">
                            <span>${formatDate(order.createdAt)}</span>
                            <span class="payment-id">Payment: ${escapeHtml(order.paymentId || "—")}</span>
                        </div>
                    </div>
                `;
            }).join("");
        }

        // ============================================
        // LOAD ORDERS & POLLING LOGIC
        // ============================================
        async function loadOrders(isPolling = false) {
            const token = localStorage.getItem("token");
            if (!token) {
                if (!isPolling) {
                    sessionStorage.setItem("lg_return_to", "/my-orders.html");
                    window.location.href = "login.html";
                }
                return;
            }

            try {
                const res = await fetch(`${BACKEND_URL}/my-orders`, {
                    headers: { "Authorization": "Bearer " + token },
                });

                const data = await res.json();

                if (res.status === 401) {
                    if (!isPolling) {
                        localStorage.removeItem("token");
                        localStorage.removeItem("user");
                        sessionStorage.setItem("lg_return_to", "/my-orders.html");
                        window.location.href = "login.html";
                    }
                    return;
                }

                if (!res.ok || !data.success) {
                    if (!isPolling) showError(data.error || "Could not load orders.");
                    return;
                }

                const orders = data.orders || [];
                let hasStatusChanged = false; // Flag to re-render if needed

                // 🔔 CHECK FOR STATUS CHANGES
                if (!isFirstLoad) {
                    orders.forEach(order => {
                        const oldStatus = previousStatuses[order._id];
                        const newStatus = order.status || "Confirmed";

                        if (oldStatus && oldStatus !== newStatus) {
                            
                            // Trigger the popup
                            if (newStatus === "Preparing") {
                                showNotification("Order is Preparing! 👨‍🍳", `Your order #${order._id.slice(-6).toUpperCase()} is now in the kitchen.`, newStatus);
                            }
                            if (newStatus === "Delivered") {
                                showNotification("Order Delivered! 🎉", `Enjoy your meal! Order #${order._id.slice(-6).toUpperCase()} has arrived.`, newStatus);
                            }
                            if (newStatus === "Cancelled") {
                                showNotification("Order Cancelled ❌", `Order #${order._id.slice(-6).toUpperCase()} was cancelled.`, newStatus);
                            }
                            
                            hasStatusChanged = true; // A change was detected

                            // 🚀 DIRECT BADGE UPDATE
                            // We use querySelector with the data attribute which is 100% reliable
                            const badge = document.querySelector(`.status[data-order-id="${order._id}"]`);
                            if (badge) {
                                const cleanStatus = newStatus.charAt(0).toUpperCase() + newStatus.slice(1).toLowerCase();
                                badge.setAttribute("data-status", cleanStatus);
                                badge.textContent = cleanStatus;
                            }
                        }
                        previousStatuses[order._id] = newStatus;
                    });
                    
                    // As an absolute fallback, if anything changed, re-render the whole list
                    // This guarantees the UI is always in sync with the data.
                    if (hasStatusChanged) {
                        renderOrders(orders);
                    }

                } else {
                    // First load: Save statuses silently
                    orders.forEach(order => {
                        previousStatuses[order._id] = order.status || "Confirmed";
                    });
                    isFirstLoad = false;
                    renderOrders(orders);
                }

            } catch (err) {
                if (!isPolling) {
                    console.error("Load orders error:", err);
                    showError("Server is waking up. Please refresh in a moment.");
                }
            }
        }

        // ============================================
        // INIT
        // ============================================
        document.addEventListener("DOMContentLoaded", () => {
            // Ask for browser notification permission
            if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }

            // Load initially
            loadOrders(false);

            // 🔄 POLLING: Check for updates every 10 seconds
            setInterval(() => {
                loadOrders(true);
            }, 10000); // 10,000 ms = 10 seconds
        });
    </script>

</body>
</html>
