<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Mixtape Kitchen</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root { 
            --gold: #c8a97e; 
            --gold-dark: #b18f64;
            --dark: #111; 
            --bg: #f4f6f9; 
            --white: #ffffff;
            --text: #333;
            --muted: #888;
            --blue: #1976d2;
            --orange: #f57c00;
            --green: #2e7d32;
            --red: #c62828;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; overflow-x: hidden; }

        /* ===== CUSTOM SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            background: var(--dark);
            color: #fff;
            position: fixed;
            height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 20px rgba(0,0,0,0.1);
            z-index: 100;
        }
        .sidebar h1 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            color: var(--gold);
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 1px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            color: #ccc;
            text-decoration: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-item.active {
            background: linear-gradient(135deg, rgba(200, 169, 126, 0.15), rgba(200, 169, 126, 0.05));
            color: var(--gold);
            border-left: 4px solid var(--gold);
        }
        .nav-item i { font-size: 18px; width: 20px; text-align: center; }
        .sidebar-footer { margin-top: auto; }
        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s;
        }
        .back-btn:hover { background: var(--gold); color: #fff; }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
            width: calc(100% - 260px);
        }
        
        /* ===== TOP BAR ===== */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;}
        .top-bar-left h2 { font-family: 'Playfair Display', serif; font-size: 32px; color: #1a1a1a; }
        .top-bar-left p { color: var(--muted); font-size: 14px; margin-top: 4px; }
        .top-bar-right { display: flex; gap: 15px; align-items: center; }
        
        .clock-box {
            background: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .clock-box i { color: var(--gold); }

        .refresh-btn {
            background: #fff;
            border: 1px solid #ddd;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .refresh-btn:hover { background: var(--gold); color: #fff; border-color: var(--gold); }
        .refresh-btn i { transition: transform 0.5s ease; }
        .refresh-btn.spinning i { transform: rotate(360deg); }

        /* ===== STATS CARDS (TOP) ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #fff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.03);
            border: 1px solid rgba(200, 169, 126, 0.15);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(200, 169, 126, 0.15); }
        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: rgba(200, 169, 126, 0.1);
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }
        .stat-info h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;}
        .stat-info p { font-size: 26px; color: #1a1a1a; font-weight: 700; line-height: 1.2; }
        .live-split { display: flex; gap: 15px; margin-top: 6px; }
        .live-split div { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .live-split .dot { width: 8px; height: 8px; border-radius: 50%; }
        .live-split .blue { background: var(--blue); }
        .live-split .orange { background: var(--orange); }

        /* ===== STATUS BREAKDOWN CARDS ===== */
        .status-breakdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .status-box {
            background: #fff;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border-top: 4px solid;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }
        .status-box:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
        .status-box.active-filter { box-shadow: inset 0 0 0 2px #333; }
        .status-box .status-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 4px; }
        .status-box .status-count { font-size: 28px; font-weight: 800; color: #1a1a1a; }
        .confirmed-box { border-color: var(--blue); }
        .preparing-box { border-color: var(--orange); }
        .delivered-box { border-color: var(--green); }
        .cancelled-box { border-color: var(--red); }

        /* ===== SEARCH BAR (NEW) ===== */
        .search-container {
            margin-bottom: 24px;
            position: relative;
            max-width: 500px;
        }
        .search-container i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            font-size: 18px;
        }
        .search-container input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 15px;
            font-weight: 500;
            outline: none;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .search-container input:focus {
            border-color: var(--gold);
            box-shadow: 0 4px 20px rgba(200, 169, 126, 0.15);
        }

        /* ===== TABS ===== */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== ORDER CARDS ===== */
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.04);
            border-left: 5px solid var(--gold);
            transition: 0.3s;
        }
        .card:hover { box-shadow: 0 10px 35px rgba(0,0,0,0.08); }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            border-bottom: 1px dashed #eee;
            padding-bottom: 16px;
        }
        .card-header h3 { font-size: 18px; color: #1a1a1a; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;}
        .card-header small { color: var(--muted); font-size: 13px; display: block; margin-top: 4px; }
        
        .time-ago { 
            color: var(--orange); 
            font-weight: 700; 
            font-size: 11px; 
            background: #fff3e0; 
            padding: 4px 10px; 
            border-radius: 20px; 
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .time-ago.urgent { background: #ffebee; color: var(--red); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        
        .card-header .amount { font-size: 24px; font-weight: 800; color: var(--gold); }
        
        .customer-info {
            display: flex;
            gap: 24px;
            font-size: 13.5px;
            color: #555;
            margin-bottom: 20px;
            background: #fdfaf5;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid rgba(200, 169, 126, 0.2);
            flex-wrap: wrap;
        }
        .customer-info span { display: flex; align-items: center; gap: 8px; font-weight: 500; }
        .customer-info i { color: var(--gold); font-size: 16px; }
        
        .items-list { list-style: none; margin-bottom: 24px; }
        .items-list li {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 14.5px;
            color: #444;
            border-bottom: 1px solid #f5f5f5;
        }
        .items-list li:last-child { border-bottom: none; }
        .items-list li span:first-child { font-weight: 500; color: #1a1a1a; display: flex; align-items: center; gap: 10px;}
        
        .status-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 16px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #f5f5f5;
            flex-wrap: wrap;
        }
        .status-row label { font-size: 14px; font-weight: 600; color: #555; }
        
        select {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1.5px solid #ddd;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            background: #fff;
            cursor: pointer;
            transition: 0.3s;
            color: #333;
        }
        select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200, 169, 126, 0.2); }
        
        .badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;}
        .badge.Confirmed { background: #e3f2fd; color: var(--blue); }
        .badge.Preparing { background: #fff3e0; color: var(--orange); }
        .badge.Delivered { background: #e8f5e9; color: var(--green); }
        .badge.Cancelled { background: #ffebee; color: var(--red); }

        /* ===== RESERVATIONS TICKET STYLE ===== */
        .res-card {
            display: flex;
            background: #fff;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
            border: 1px solid rgba(200, 169, 126, 0.2);
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .res-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(200, 169, 126, 0.15);
        }
        .res-left { flex: 1; padding: 28px 32px; position: relative; }
        .res-header { display: flex; align-items: center; gap: 15px; margin-bottom: 16px; flex-wrap: wrap; }
        .res-header h3 { font-family: 'Playfair Display', serif; font-size: 22px; color: #1a1a1a; font-weight: 700; margin: 0; }
        .res-guests { display: inline-flex; align-items: center; gap: 8px; background: #fdfaf5; color: var(--gold-dark); padding: 6px 14px; border-radius: 20px; font-size: 14px; border: 1px solid rgba(200, 169, 126, 0.3); margin-bottom: 20px; }
        .res-guests i { color: var(--gold); }
        .res-contact { display: flex; gap: 24px; font-size: 14px; color: #555; flex-wrap: wrap; }
        .res-contact span { display: flex; align-items: center; gap: 10px; background: #f8f9fa; padding: 10px 16px; border-radius: 10px; border: 1px solid #eee; }
        .res-contact i { color: #888; }
        .res-right {
            background: linear-gradient(135deg, rgba(200, 169, 126, 0.08), rgba(200, 169, 126, 0.03));
            padding: 28px 32px; border-left: 2px dashed rgba(200, 169, 126, 0.4); min-width: 240px;
            display: flex; flex-direction: column; justify-content: center; gap: 20px; position: relative;
        }
        .res-right::before, .res-right::after {
            content: ''; position: absolute; left: -10px; width: 20px; height: 20px; background: var(--bg); border-radius: 50%; border: 1px solid rgba(200, 169, 126, 0.2);
        }
        .res-right::before { top: -10px; }
        .res-right::after { bottom: -10px; }
        .ticket-date, .ticket-time { display: flex; align-items: center; gap: 14px; }
        .ticket-date i, .ticket-time i { font-size: 24px; color: var(--gold); background: #fff; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; box-shadow: 0 4px 10px rgba(200, 169, 126, 0.2); }
        .ticket-date small, .ticket-time small { display: block; font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--muted); margin-bottom: 2px; }
        .ticket-date span, .ticket-time span { display: block; font-size: 16px; font-weight: 700; color: #1a1a1a; }

        .empty-state { text-align: center; padding: 60px 20px; background: #fff; border-radius: 16px; border: 1px dashed #ddd;}
        .empty-state i { font-size: 40px; color: #ccc; margin-bottom: 15px; }
        .empty-state h3 { font-size: 18px; color: #555; margin-bottom: 5px; }
        .empty-state p { font-size: 14px; color: var(--muted); }

        .loading { text-align: center; padding: 60px; font-size: 16px; color: var(--muted); }
        .loading i { font-size: 30px; color: var(--gold); animation: spin 1s linear infinite; margin-bottom: 15px; display: block;}
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        /* Mobile Responsive */
        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .status-breakdown { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; padding: 20px; flex-direction: row; flex-wrap: wrap; justify-content: space-between; align-items: center; }
            .sidebar h1 { margin-bottom: 0; font-size: 22px; }
            .sidebar-nav { display: flex; gap: 10px; width: 100%; margin-top: 15px; }
            .nav-item { margin-bottom: 0; padding: 10px 15px; font-size: 14px; }
            .sidebar-footer { display: none; }
            .main-content { margin-left: 0; width: 100%; padding: 20px; }
            .top-bar h2 { font-size: 24px; }
            .card-header { flex-direction: column; gap: 10px; }
            .res-card { flex-direction: column; }
            .res-right { 
                border-left: none; border-top: 2px dashed rgba(200, 169, 126, 0.4); flex-direction: row; justify-content: flex-start; padding: 20px 32px;
            }
            .res-right::before { left: -10px; top: -10px; }
            .res-right::after { left: auto; right: -10px; top: -10px; bottom: auto; }
        }
        @media (max-width: 600px) {
            .stats-grid, .status-breakdown { grid-template-columns: 1fr; }
            .top-bar-right { width: 100%; justify-content: space-between; }
            .res-contact { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h1>Mixtape Admin</h1>
        
        <div class="sidebar-nav">
            <a class="nav-item active" onclick="switchTab('orders')" id="nav-orders">
                <i class="fas fa-shopping-bag"></i> Orders
            </a>
            <a class="nav-item" onclick="switchTab('reservations')" id="nav-reservations">
                <i class="fas fa-calendar-alt"></i> Reservations
            </a>
        </div>

        <div class="sidebar-footer">
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back to Site
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        
        <div class="top-bar">
            <div class="top-bar-left">
                <h2 id="page-title">Manage Orders</h2>
                <p>Real-time overview of your restaurant's activity</p>
            </div>
            <div class="top-bar-right">
                <div class="clock-box">
                    <i class="far fa-clock"></i>
                    <span id="live-clock">--:-- --</span>
                </div>
                <button class="refresh-btn" id="refreshBtn" onclick="refreshData()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
        </div>

        <!-- TOP STATS -->
        <div class="stats-grid" id="stats-container">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-receipt"></i></div>
                <div class="stat-info">
                    <h3>Total Orders</h3>
                    <p id="stat-total-orders">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(46, 125, 50, 0.1); color: var(--green);"><i class="fas fa-rupee-sign"></i></div>
                <div class="stat-info">
                    <h3>Total Revenue</h3>
                    <p id="stat-revenue">₹0.00</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(245, 124, 0, 0.1); color: var(--orange);"><i class="fas fa-fire"></i></div>
                <div class="stat-info">
                    <h3>Live Kitchen Queue</h3>
                    <div class="live-split">
                        <div style="color:var(--blue);"><span class="dot blue"></span> <span id="stat-pending">0</span> Pending</div>
                        <div style="color:var(--orange);"><span class="dot orange"></span> <span id="stat-preparing">0</span> Preparing</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- STATUS BREAKDOWN -->
        <div class="status-breakdown" id="status-breakdown-container">
            <div class="status-box confirmed-box" onclick="filterStatus('Confirmed')" id="filter-Confirmed">
                <div class="status-label">Confirmed</div>
                <div class="status-count" id="count-confirmed">0</div>
            </div>
            <div class="status-box preparing-box" onclick="filterStatus('Preparing')" id="filter-Preparing">
                <div class="status-label">Preparing</div>
                <div class="status-count" id="count-preparing">0</div>
            </div>
            <div class="status-box delivered-box" onclick="filterStatus('Delivered')" id="filter-Delivered">
                <div class="status-label">Delivered</div>
                <div class="status-count" id="count-delivered">0</div>
            </div>
            <div class="status-box cancelled-box" onclick="filterStatus('Cancelled')" id="filter-Cancelled">
                <div class="status-label">Cancelled</div>
                <div class="status-count" id="count-cancelled">0</div>
            </div>
        </div>

        <!-- ORDERS TAB -->
        <div id="tab-orders" class="tab-content active">
            
            <!-- SEARCH BAR -->
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search by Order ID, Name, Email, or Payment ID..." oninput="renderOrderList()">
            </div>

            <div id="orders-loading" class="loading" style="display:none;"><i class="fas fa-spinner"></i> Loading orders...</div>
            <div id="orders-list"></div>
        </div>

        <!-- RESERVATIONS TAB -->
        <div id="tab-reservations" class="tab-content">
            <div id="reservations-loading" class="loading" style="display:none;"><i class="fas fa-spinner"></i> Loading reservations...</div>
            <div id="reservations-list"></div>
        </div>

    </main>

    <script>
        const BACKEND_URL = "https://feliciano-master.onrender.com";
        const token = localStorage.getItem("token");
        const user = JSON.parse(localStorage.getItem("user") || "null");
        
        let allOrdersData = []; 
        let currentFilter = "All"; 

        // 🔒 SECURITY CHECK
        if (!token || !user || user.role !== "admin") {
            alert("Access Denied. You are not an admin.");
            window.location.href = "login.html";
        }

        // LIVE CLOCK
        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        // UI SWITCHING
        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`nav-${tab}`).classList.add('active');
            
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');

            if (tab === 'orders') {
                document.getElementById('page-title').innerText = "Manage Orders";
                document.getElementById('stats-container').style.display = "grid";
                document.getElementById('status-breakdown-container').style.display = "grid";
            } else {
                document.getElementById('page-title').innerText = "Table Reservations";
                document.getElementById('stats-container').style.display = "none";
                document.getElementById('status-breakdown-container').style.display = "none";
            }
        }

        function refreshData() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('spinning');
            setTimeout(() => btn.classList.remove('spinning'), 600); 

            if (document.getElementById('tab-orders').classList.contains('active')) {
                loadOrders();
            } else {
                loadReservations();
            }
        }

        // FORMAT TIME AGO
        function timeAgo(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            
            if (diffMins < 1) return { text: "Just now", urgent: false };
            if (diffMins < 60) return { text: `${diffMins} mins ago`, urgent: diffMins > 20 };
            
            const diffHours = Math.floor(diffMins / 60);
            if (diffHours < 24) return { text: `${diffHours} hrs ago`, urgent: true };
            
            return { text: Math.floor(diffHours / 24) + " days ago", urgent: true };
        }

        // FILTER LOGIC (Status)
        function filterStatus(status) {
            currentFilter = (currentFilter === status) ? "All" : status; 

            document.querySelectorAll('.status-box').forEach(el => el.classList.remove('active-filter'));
            if (currentFilter !== "All") {
                document.getElementById(`filter-${currentFilter}`).classList.add('active-filter');
            }

            renderOrderList();
        }

        // RENDER ORDER LIST (Handles Status + Search)
        function renderOrderList() {
            const listEl = document.getElementById("orders-list");
            const searchTerm = document.getElementById("searchInput").value.toLowerCase().trim();
            
            let filteredData = allOrdersData;

            // 1. Filter by Status
            if (currentFilter !== "All") {
                filteredData = filteredData.filter(o => (o.status || 'Confirmed') === currentFilter);
            }

            // 2. Filter by Search
            if (searchTerm) {
                filteredData = filteredData.filter(order => {
                    const orderId = order._id ? order._id.toLowerCase() : "";
                    const paymentId = order.paymentId ? order.paymentId.toLowerCase() : "";
                    const customerName = order.userId && order.userId.name ? order.userId.name.toLowerCase() : "";
                    const customerEmail = order.userId && order.userId.email ? order.userId.email.toLowerCase() : "";
                    
                    return orderId.includes(searchTerm) || 
                           paymentId.includes(searchTerm) || 
                           customerName.includes(searchTerm) || 
                           customerEmail.includes(searchTerm);
                });
            }

            // Render Results
            if (!filteredData.length) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h3>No Orders Found</h3>
                        <p>No orders match your current filter or search query.</p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = filteredData.map(order => {
                const customer = order.userId ? `<strong>${order.userId.name}</strong> (${order.userId.email})` : "Guest User";
                const itemsHtml = order.items.map(item => `
                    <li>
                        <span><i class="fas fa-utensils" style="color:#ccc; font-size:12px;"></i> ${item.quantity}x ${item.name}</span>
                        <span>₹${(item.price * item.quantity).toFixed(2)}</span>
                    </li>
                `).join("");

                const showTimeAgo = order.status !== 'Delivered' && order.status !== 'Cancelled';
                const timeInfo = timeAgo(order.createdAt);

                return `
                    <div class="card">
                        <div class="card-header">
                            <div>
                                <h3>
                                    Order #${order._id.slice(-6).toUpperCase()}
                                    ${showTimeAgo ? `<span class="time-ago ${timeInfo.urgent ? 'urgent' : ''}"><i class="far fa-clock"></i> ${timeInfo.text}</span>` : ''}
                                </h3>
                                <small><i class="far fa-calendar-alt"></i> ${new Date(order.createdAt).toLocaleString()}</small>
                            </div>
                            <div class="amount">₹${order.amount.toFixed(2)}</div>
                        </div>
                        
                        <div class="customer-info">
                            <span><i class="fas fa-user"></i> ${customer}</span>
                            <span><i class="fas fa-credit-card"></i> ${order.paymentId}</span>
                        </div>

                        <ul class="items-list">${itemsHtml}</ul>

                        <div class="status-row">
                            <label>Update Status:</label>
                            <span class="badge ${order.status || 'Confirmed'}" id="badge-${order._id}">${order.status || 'Confirmed'}</span>
                            <select onchange="updateStatus('${order._id}', this.value)">
                                <option value="Confirmed" ${order.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                                <option value="Preparing" ${order.status === 'Preparing' ? 'selected' : ''}>Preparing</option>
                                <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                                <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                            </select>
                        </div>
                    </div>
                `;
            }).join("");
        }

        // FETCH ORDERS
        async function loadOrders() {
            const loader = document.getElementById("orders-loading");
            loader.style.display = "block";
            document.getElementById("orders-list").innerHTML = "";

            try {
                const res = await fetch(`${BACKEND_URL}/admin/orders`, {
                    headers: { "Authorization": "Bearer " + token }
                });
                const data = await res.json();
                loader.style.display = "none";

                allOrdersData = data.orders || [];

                // Calculate Stats
                let totalRevenue = 0;
                let countConfirmed = 0;
                let countPreparing = 0;
                let countDelivered = 0;
                let countCancelled = 0;

                allOrdersData.forEach(o => {
                    totalRevenue += o.amount;
                    const status = o.status || 'Confirmed';
                    
                    if (status === 'Confirmed') countConfirmed++;
                    else if (status === 'Preparing') countPreparing++;
                    else if (status === 'Delivered') countDelivered++;
                    else if (status === 'Cancelled') countCancelled++;
                });

                // Update Top Stats
                document.getElementById("stat-total-orders").innerText = allOrdersData.length;
                document.getElementById("stat-revenue").innerText = "₹" + totalRevenue.toFixed(2);
                document.getElementById("stat-pending").innerText = countConfirmed;
                document.getElementById("stat-preparing").innerText = countPreparing;

                // Update Breakdown Cards
                document.getElementById("count-confirmed").innerText = countConfirmed;
                document.getElementById("count-preparing").innerText = countPreparing;
                document.getElementById("count-delivered").innerText = countDelivered;
                document.getElementById("count-cancelled").innerText = countCancelled;

                // Render List
                renderOrderList();

            } catch (err) {
                loader.style.display = "none";
                document.getElementById("orders-list").innerHTML = `<div class="loading" style="color:var(--red);">Error: ${err.message}</div>`;
            }
        }

        // UPDATE STATUS
        async function updateStatus(orderId, newStatus) {
            try {
                const res = await fetch(`${BACKEND_URL}/admin/orders/${orderId}/status`, {
                    method: "PUT",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token 
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                if (res.ok) {
                    const orderIndex = allOrdersData.findIndex(o => o._id === orderId);
                    if (orderIndex > -1) allOrdersData[orderIndex].status = newStatus;
                    
                    loadOrders(); 
                } else {
                    alert("Failed to update status");
                }
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        // FETCH RESERVATIONS
        async function loadReservations() {
            const loader = document.getElementById("reservations-loading");
            loader.style.display = "block";
            document.getElementById("reservations-list").innerHTML = "";

            try {
                const res = await fetch(`${BACKEND_URL}/admin/reservations`, {
                    headers: { "Authorization": "Bearer " + token }
                });
                const data = await res.json();
                loader.style.display = "none";

                if (!data.reservations.length) {
                    document.getElementById("reservations-list").innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-calendar-alt"></i>
                            <h3>No reservations yet</h3>
                            <p>New table bookings will appear here.</p>
                        </div>
                    `;
                    return;
                }

                document.getElementById("reservations-list").innerHTML = data.reservations.map(rsv => {
                    const timeInfo = timeAgo(rsv.createdAt);
                    
                    return `
                    <div class="res-card">
                        <div class="res-left">
                            <div class="res-header">
                                <h3>${rsv.name}</h3>
                                <span class="time-ago"><i class="far fa-clock"></i> Booked ${timeInfo.text}</span>
                            </div>
                            
                            <div class="res-guests">
                                <i class="fas fa-users"></i> <strong>${rsv.persons}</strong> Guests
                            </div>

                            <div class="res-contact">
                                <span><i class="fas fa-envelope"></i> ${rsv.email}</span>
                                <span><i class="fas fa-phone-alt"></i> ${rsv.phone}</span>
                            </div>
                        </div>

                        <div class="res-right">
                            <div class="ticket-date">
                                <i class="far fa-calendar-alt"></i>
                                <div>
                                    <small>DATE</small>
                                    <span>${rsv.date}</span>
                                </div>
                            </div>
                            <div class="ticket-time">
                                <i class="far fa-clock"></i>
                                <div>
                                    <small>TIME</small>
                                    <span>${rsv.time}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    `;
                }).join("");
            } catch (err) {
                loader.style.display = "none";
                document.getElementById("reservations-list").innerHTML = `<div class="loading" style="color:var(--red);">Error: ${err.message}</div>`;
            }
        }

        // INIT
        if (token && user && user.role === "admin") {
            document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
            loadOrders();
            loadReservations();
        }
    </script>
</body>
</html>
