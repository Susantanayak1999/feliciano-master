<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Mixtape Kitchen</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c8a97e; --dark: #1a1a1a; --bg: #f4f6f9; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: #333; padding-bottom: 50px; }
        
        .nav { background: var(--dark); padding: 18px 5%; display: flex; justify-content: space-between; align-items: center; color: #fff; }
        .nav h1 { font-size: 20px; font-weight: 600; color: var(--gold); }
        .nav a { color: #ddd; text-decoration: none; font-size: 14px; padding: 8px 16px; border-radius: 20px; background: rgba(255,255,255,0.1); transition: 0.3s; }
        .nav a:hover { background: var(--gold); color: #fff; }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        
        .tabs { display: flex; gap: 20px; margin-bottom: 30px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; font-size: 16px; font-weight: 600; color: #888; cursor: pointer; padding: 10px; transition: 0.3s; }
        .tab-btn.active { color: var(--gold); border-bottom: 3px solid var(--gold); margin-bottom: -12px; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: #fff; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); padding: 24px; margin-bottom: 20px; border-left: 5px solid var(--gold); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; border-bottom: 1px dashed #eee; padding-bottom: 15px; }
        .card-header h3 { font-size: 16px; color: #1a1a1a; }
        .card-header .amount { font-size: 20px; font-weight: 700; color: var(--gold); }
        
        .customer-info { font-size: 13px; color: #666; margin-bottom: 15px; background: #f9f9f9; padding: 10px; border-radius: 8px; }
        .customer-info span { display: inline-block; margin-right: 20px; font-weight: 500; }
        
        .items-list { list-style: none; margin-bottom: 15px; }
        .items-list li { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; border-bottom: 1px solid #f0f0f0; }
        
        .status-row { display: flex; align-items: center; gap: 10px; margin-top: 15px; }
        .status-row label { font-size: 13px; font-weight: 600; color: #555; }
        select { padding: 8px 12px; border-radius: 6px; border: 1px solid #ddd; font-size: 14px; outline: none; background: #fff; cursor: pointer; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .badge.Confirmed { background: #e3f2fd; color: #1976d2; }
        .badge.Preparing { background: #fff3e0; color: #f57c00; }
        .badge.Delivered { background: #e8f5e9; color: #2e7d32; }
        .badge.Cancelled { background: #ffebee; color: #c62828; }

        .loading { text-align: center; padding: 40px; font-size: 16px; color: #888; }
    </style>
</head>
<body>

    <nav class="nav">
        <h1>Admin Dashboard</h1>
        <a href="index.html">Back to Site</a>
    </nav>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('orders')">Manage Orders</button>
            <button class="tab-btn" onclick="switchTab('reservations')">Reservations</button>
        </div>

        <div id="tab-orders" class="tab-content active">
            <div id="orders-loading" class="loading">Loading orders...</div>
            <div id="orders-list"></div>
        </div>

        <div id="tab-reservations" class="tab-content">
            <div id="reservations-loading" class="loading">Loading reservations...</div>
            <div id="reservations-list"></div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://feliciano-master.onrender.com";
        const token = localStorage.getItem("token");
        const user = JSON.parse(localStorage.getItem("user") || "null");

        // 🔒 SECURITY CHECK
        if (!token || !user || user.role !== "admin") {
            alert("Access Denied. You are not an admin.");
            window.location.href = "login.html"; // Kick back to login
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
        }

        async function loadOrders() {
            try {
                const res = await fetch(`${BACKEND_URL}/admin/orders`, {
                    headers: { "Authorization": "Bearer " + token }
                });
                const data = await res.json();
                document.getElementById("orders-loading").style.display = "none";

                if (!data.orders.length) {
                    document.getElementById("orders-list").innerHTML = `<p style="text-align:center; padding:20px;">No orders yet.</p>`;
                    return;
                }

                document.getElementById("orders-list").innerHTML = data.orders.map(order => {
                    const customer = order.userId ? `${order.userId.name} (${order.userId.email})` : "Guest User";
                    const itemsHtml = order.items.map(item => `
                        <li><span>${item.quantity}x ${item.name}</span><span>₹${(item.price * item.quantity).toFixed(2)}</span></li>
                    `).join("");

                    return `
                        <div class="card">
                            <div class="card-header">
                                <div>
                                    <h3>Order #${order._id.slice(-6).toUpperCase()}</h3>
                                    <small style="color:#888">${new Date(order.createdAt).toLocaleString()}</small>
                                </div>
                                <div class="amount">₹${order.amount.toFixed(2)}</div>
                            </div>
                            <div class="customer-info">
                                <span>👤 ${customer}</span>
                                <span>💳 ${order.paymentId}</span>
                            </div>
                            <ul class="items-list">${itemsHtml}</ul>
                            <div class="status-row">
                                <label>Status:</label>
                                <span class="badge ${order.status || 'Confirmed'}" id="badge-${order._id}">${order.status || 'Confirmed'}</span>
                                <select onchange="updateStatus('${order._id}', this.value)">
                                    <option value="Confirmed" ${order.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                                    <option value="Preparing" ${order.status === 'Preparing' ? 'selected' : ''}>Preparing</option>
                                    <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                                    <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                                </select>
                            </div>
                        </div>
                    `;
                }).join("");
            } catch (err) {
                document.getElementById("orders-loading").innerText = "Error: " + err.message;
            }
        }

        async function updateStatus(orderId, newStatus) {
            try {
                const res = await fetch(`${BACKEND_URL}/admin/orders/${orderId}/status`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
                    body: JSON.stringify({ status: newStatus })
                });
                if (res.ok) {
                    const badge = document.getElementById(`badge-${orderId}`);
                    badge.className = `badge ${newStatus}`;
                    badge.innerText = newStatus;
                }
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        async function loadReservations() {
            try {
                const res = await fetch(`${BACKEND_URL}/admin/reservations`, {
                    headers: { "Authorization": "Bearer " + token }
                });
                const data = await res.json();
                document.getElementById("reservations-loading").style.display = "none";

                if (!data.reservations.length) {
                    document.getElementById("reservations-list").innerHTML = `<p style="text-align:center; padding:20px;">No reservations yet.</p>`;
                    return;
                }

                document.getElementById("reservations-list").innerHTML = data.reservations.map(rsv => `
                    <div class="card">
                        <div class="card-header">
                            <div>
                                <h3>${rsv.name} - ${rsv.persons} Guests</h3>
                                <small style="color:#888">Booked: ${new Date(rsv.createdAt).toLocaleString()}</small>
                            </div>
                            <div class="amount" style="color:#333; font-size:16px;">${rsv.date} @ ${rsv.time}</div>
                        </div>
                        <div class="customer-info">
                            <span>📧 ${rsv.email}</span>
                            <span>📞 ${rsv.phone}</span>
                        </div>
                    </div>
                `).join("");
            } catch (err) {
                document.getElementById("reservations-loading").innerText = "Error: " + err.message;
            }
        }

        if (token && user && user.role === "admin") {
            loadOrders();
            loadReservations();
        }
    </script>
</body>
</html>
