<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Mixtape Kitchen</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --gold: #c8a97e;
            --gold-dark: #b18f64;
            --dark: #111;
            --bg: #f4f6f9;
            --white: #ffffff;
            --text: #333;
            --muted: #888;
            --blue: #1976d2;
            --orange: #f57c00;
            --green: #2e7d32;
            --red: #c62828;
            --veg: #2e7d32;
            --nonveg: #b71c1c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            background: var(--dark);
            color: #fff;
            position: fixed;
            height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .sidebar h1 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            color: var(--gold);
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 1px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            color: #ccc;
            text-decoration: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .nav-item:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
        .nav-item.active {
            background: linear-gradient(135deg, rgba(200, 169, 126, 0.15), rgba(200, 169, 126, 0.05));
            color: var(--gold);
            border-left: 4px solid var(--gold);
        }

        .nav-item i { font-size: 18px; width: 20px; text-align: center; }
        .sidebar-footer { margin-top: auto; }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s;
        }

        .back-btn:hover { background: var(--gold); color: #fff; }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
            width: calc(100% - 260px);
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .top-bar-left h2 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: #1a1a1a;
        }

        .top-bar-left p {
            color: var(--muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .top-bar-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .clock-box {
            background: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .clock-box i { color: var(--gold); }

        .refresh-btn {
            background: #fff;
            border: 1px solid #ddd;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }

        .refresh-btn:hover {
            background: var(--gold);
            color: #fff;
            border-color: var(--gold);
        }

        .refresh-btn i {
            transition: transform 0.5s ease;
        }

        .refresh-btn.spinning i {
            transform: rotate(360deg);
        }

        /* ===== TABS ===== */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== RESERVATIONS (REVAMPED) ===== */
        .res-card {
            background: #fff; border-radius: 20px; margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); border: 1px solid rgba(200, 169, 126, 0.15);
            overflow: hidden; position: relative; transition: all 0.3s ease;
            display: flex; flex-direction: column;
        }
        .res-card:hover { box-shadow: 0 15px 40px rgba(200, 169, 126, 0.12); transform: translateY(-3px); }

        /* Top Bar inside Card */
        .res-card-top {
            padding: 20px 30px; border-bottom: 1px dashed #eee;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
            background: #fafaf8;
        }
        
        .res-header-info { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .res-header-info h3 { font-family: 'Playfair Display', serif; font-size: 24px; color: #1a1a1a; font-weight: 700; margin: 0; }
        
        .status-badge {
            padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 6px;
        }
        .status-pending { background: #fff3e0; color: #f57c00; }
        .status-approved { background: #e8f5e9; color: #2e7d32; }
        .status-cancelled { background: #ffebee; color: #c62828; }

        .time-ago { color: var(--muted); font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 5px; }

        /* Content Area */
        .res-card-content {
            display: flex; padding: 25px 30px; gap: 30px; flex-wrap: wrap; justify-content: space-between;
        }
        .res-details { flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 15px; }
        
        .res-guests { display: inline-flex; align-items: center; gap: 8px; background: #fdfaf5; color: var(--gold-dark); padding: 8px 16px; border-radius: 30px; font-size: 14px; font-weight: 600; width: fit-content; border: 1px solid rgba(200, 169, 126, 0.3); }
        
        .res-contact { display: flex; gap: 15px; flex-wrap: wrap; }
        .res-contact span { display: flex; align-items: center; gap: 10px; background: #f8f9fa; padding: 10px 16px; border-radius: 10px; border: 1px solid #eee; font-size: 14px; color: #555; font-weight: 500; }
        .res-contact i { color: #888; }

        .res-ticket { 
            display: flex; gap: 20px; background: linear-gradient(135deg, rgba(200,169,126,0.08), rgba(200,169,126,0.02));
            padding: 20px 25px; border-radius: 16px; border: 1px solid rgba(200, 169, 126, 0.2); align-items: center; min-width: 280px;
        }
        .ticket-item { display: flex; align-items: center; gap: 12px; }
        .ticket-item i { font-size: 20px; color: var(--gold); background: #fff; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; box-shadow: 0 4px 10px rgba(200, 169, 126, 0.2); }
        .ticket-text small { display: block; font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--muted); margin-bottom: 2px; }
        .ticket-text span { display: block; font-size: 15px; font-weight: 700; color: #1a1a1a; }

        /* Action Area */
        .res-actions { padding: 15px 30px; border-top: 1px solid #eee; display: flex; justify-content: flex-end; gap: 15px; background: #fafafa; }
        
        .btn-action {
            padding: 10px 24px; border-radius: 30px; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600;
            cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s ease; border: none;
        }
        .btn-approve { background: #e8f5e9; color: #2e7d32; border: 1.5px solid #c8e6c9; }
        .btn-approve:hover { background: #2e7d32; color: #fff; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(46, 125, 50, 0.3); }
        
        .btn-cancel { background: #ffebee; color: #c62828; border: 1.5px solid #ffcdd2; }
        .btn-cancel:hover { background: #c62828; color: #fff; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(198, 40, 40, 0.3); }

        .empty-state { text-align: center; padding: 60px 20px; background: #fff; border-radius: 16px; border: 1px dashed #ddd; }
        .empty-state i { font-size: 40px; color: #ccc; margin-bottom: 15px; }
        .empty-state h3 { font-size: 18px; color: #555; margin-bottom: 5px; }
        .empty-state p { font-size: 14px; color: var(--muted); }
        
        .loading { text-align: center; padding: 60px; font-size: 16px; color: var(--muted); }
        .loading i { font-size: 30px; color: var(--gold); animation: spin 1s linear infinite; margin-bottom: 15px; display: block; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Mobile Responsive */
        @media (max-width: 1024px) {
            .res-card-content { flex-direction: column; }
            .res-ticket { width: 100%; justify-content: flex-start; }
        }
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; padding: 20px; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: space-between; align-items: center; }
            .sidebar h1 { margin-bottom: 0; font-size: 22px; flex: 1; }
            .sidebar-footer { display: block; margin-top: 0; order: 3; }
            .back-btn { padding: 8px 16px; font-size: 13px; width: auto; }
            .back-btn span { display: none; }
            .sidebar-nav { display: flex; gap: 10px; width: 100%; margin-top: 15px; order: 4; }
            .nav-item { margin-bottom: 0; padding: 10px 15px; font-size: 14px; }
            .main-content { margin-left: 0; width: 100%; padding: 20px; }
            .top-bar-left h2 { font-size: 24px; }
            .res-actions { justify-content: stretch; }
            .btn-action { flex: 1; justify-content: center; }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h1>Mixtape Admin</h1>
        <div class="sidebar-nav">
            <a class="nav-item active" onclick="switchTab('reservations')" id="nav-reservations">
                <i class="fas fa-calendar-alt"></i> Reservations
            </a>
        </div>
        <div class="sidebar-footer">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Site</a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">

        <div class="top-bar">
            <div class="top-bar-left">
                <h2 id="page-title">Table Reservations</h2>
                <p>Manage your restaurant's table bookings</p>
            </div>
            <div class="top-bar-right">
                <div class="clock-box">
                    <i class="fas fa-circle" style="font-size: 8px; color: #2e7d32; animation: pulse 2s infinite;"></i> Live
                </div>
                <button class="refresh-btn" id="refreshBtn" onclick="refreshData(true)">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
        </div>

        <!-- RESERVATIONS TAB -->
        <div id="tab-reservations" class="tab-content active">
            <div id="reservations-loading" class="loading" style="display:none;"><i class="fas fa-spinner"></i> Loading reservations...</div>
            <div id="reservations-list"></div>
        </div>

    </main>

    <script>
        const BACKEND_URL = "https://feliciano-master.onrender.com";
        const token = localStorage.getItem("token");
        const user = JSON.parse(localStorage.getItem("user") || "null");

        if (!token || !user || user.role !== "admin") {
            alert("Access Denied. You are not an admin.");
            window.location.href = "index.html";
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`nav-${tab}`).classList.add('active');
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            loadReservations();
        }

        async function refreshData(isManual = false) {
            const btn = document.getElementById('refreshBtn');
            if (isManual) { btn.classList.add('spinning'); setTimeout(() => btn.classList.remove('spinning'), 600); }
            await loadReservations();
        }

        function timeAgo(dateString) {
            const date = new Date(dateString); const now = new Date(); const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            if (diffMins < 1) return "Just now";
            if (diffMins < 60) return `${diffMins} mins ago`;
            const diffHours = Math.floor(diffMins / 60);
            if (diffHours < 24) return `${diffHours} hrs ago`;
            return Math.floor(diffHours / 24) + " days ago";
        }

        async function loadReservations() {
            const loader = document.getElementById("reservations-loading");
            loader.style.display = "block"; 
            document.getElementById("reservations-list").innerHTML = "";

            try {
                const res = await fetch(`${BACKEND_URL}/admin/reservations`, { headers: { "Authorization": "Bearer " + token } });
                const data = await res.json();
                loader.style.display = "none";

                if (!data.reservations.length) {
                    document.getElementById("reservations-list").innerHTML = `<div class="empty-state"><i class="fas fa-calendar-alt"></i><h3>No reservations yet</h3><p>New table bookings will appear here.</p></div>`;
                    return;
                }

                // Sort so 'pending' is at the top
                const sortedReservations = data.reservations.sort((a, b) => {
                    if (a.status === 'pending' && b.status !== 'pending') return -1;
                    if (a.status !== 'pending' && b.status === 'pending') return 1;
                    return new Date(b.createdAt) - new Date(a.createdAt);
                });

                document.getElementById("reservations-list").innerHTML = sortedReservations.map(rsv => {
                    const currentStatus = rsv.status || 'pending';
                    
                    let badgeClass = 'status-pending';
                    let badgeIcon = 'fa-clock';
                    let badgeText = 'Pending';
                    if (currentStatus === 'approved') { badgeClass = 'status-approved'; badgeIcon = 'fa-check-circle'; badgeText = 'Approved'; }
                    if (currentStatus === 'cancelled') { badgeClass = 'status-cancelled'; badgeIcon = 'fa-times-circle'; badgeText = 'Cancelled'; }

                    return `
                    <div class="res-card">
                        
                        <!-- Top Header -->
                        <div class="res-card-top">
                            <div class="res-header-info">
                                <h3>${rsv.name}</h3>
                                <span class="status-badge ${badgeClass}"><i class="fas ${badgeIcon}"></i> ${badgeText}</span>
                            </div>
                            <div class="time-ago"><i class="far fa-clock"></i> Booked ${timeAgo(rsv.createdAt)}</div>
                        </div>

                        <!-- Details Area -->
                        <div class="res-card-content">
                            <div class="res-details">
                                <div class="res-guests"><i class="fas fa-users"></i> <strong>${rsv.persons}</strong> Guests</div>
                                <div class="res-contact">
                                    <span><i class="fas fa-envelope"></i> ${rsv.email}</span>
                                    <span><i class="fas fa-phone-alt"></i> ${rsv.phone}</span>
                                </div>
                            </div>

                            <!-- Ticket Style Date/Time -->
                            <div class="res-ticket">
                                <div class="ticket-item">
                                    <i class="far fa-calendar-alt"></i>
                                    <div class="ticket-text"><small>DATE</small><span>${rsv.date}</span></div>
                                </div>
                                <div class="ticket-item">
                                    <i class="far fa-clock"></i>
                                    <div class="ticket-text"><small>TIME</small><span>${rsv.time}</span></div>
                                </div>
                            </div>
                        </div>

                        <!-- Action Buttons (Only show if pending) -->
                        ${currentStatus === 'pending' ? `
                        <div class="res-actions">
                            <button class="btn-action btn-cancel" onclick="updateReservationStatus('${rsv._id}', 'cancelled', this)">
                                <i class="fas fa-times"></i> Cancel
                            </button>
                            <button class="btn-action btn-approve" onclick="updateReservationStatus('${rsv._id}', 'approved', this)">
                                <i class="fas fa-check"></i> Approve
                            </button>
                        </div>
                        ` : ''}

                    </div>
                    `;
                }).join("");
            } catch (err) {
                loader.style.display = "none"; 
                document.getElementById("reservations-list").innerHTML = `<div class="loading" style="color:var(--red);">Error: ${err.message}</div>`;
            }
        }

        // 🚀 Update Status Logic
        async function updateReservationStatus(id, status, btnElement) {
            const actionText = status === 'approved' ? 'Approve' : 'Cancel';
            if (!confirm(`Are you sure you want to ${actionText.toLowerCase()} this reservation? An email will be sent to the customer.`)) return;

            // Change button text to show loading
            const originalText = btnElement.innerHTML;
            btnElement.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Processing...`;
            btnElement.disabled = true;

            try {
                const res = await fetch(`${BACKEND_URL}/admin/reservations/${id}/status`, {
                    method: "PUT",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token 
                    },
                    body: JSON.stringify({ status })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    loadReservations(); // Reload to update UI and badges
                } else {
                    alert("Failed to update: " + (data.error || "Unknown error"));
                    btnElement.innerHTML = originalText;
                    btnElement.disabled = false;
                }
            } catch (err) {
                alert("Error: " + err.message);
                btnElement.innerHTML = originalText;
                btnElement.disabled = false;
            }
        }

        // Load initially
        if (token && user && user.role === "admin") {
            loadReservations();
        }
    </script>
</body>

</html>
