<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Mixtape Kitchen</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root { 
            --gold: #c8a97e; 
            --gold-dark: #b18f64;
            --dark: #111; 
            --dark-2: #1a1a1a;
            --bg: #f4f6f9; 
            --white: #ffffff;
            --text: #333;
            --muted: #888;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            background: var(--dark);
            color: #fff;
            position: fixed;
            height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 20px rgba(0,0,0,0.1);
        }
        .sidebar h1 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            color: var(--gold);
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 1px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            color: #ccc;
            text-decoration: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-item.active {
            background: linear-gradient(135deg, rgba(200, 169, 126, 0.15), rgba(200, 169, 126, 0.05));
            color: var(--gold);
            border-left: 4px solid var(--gold);
        }
        .nav-item i { font-size: 18px; width: 20px; text-align: center; }
        .sidebar-footer { margin-top: auto; }
        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s;
        }
        .back-btn:hover { background: var(--gold); color: #fff; }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
            width: calc(100% - 260px);
        }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .top-bar h2 { font-family: 'Playfair Display', serif; font-size: 32px; color: #1a1a1a; }
        .refresh-btn {
            background: #fff;
            border: 1px solid #ddd;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .refresh-btn:hover { background: var(--gold); color: #fff; border-color: var(--gold); }

        /* ===== STATS CARDS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: #fff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.03);
            border: 1px solid rgba(200, 169, 126, 0.15);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(200, 169, 126, 0.15); }
        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: rgba(200, 169, 126, 0.1);
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .stat-info h3 { font-size: 14px; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
        .stat-info p { font-size: 24px; color: #1a1a1a; font-weight: 700; }

        /* ===== TABS ===== */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== CARDS ===== */
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.04);
            border-left: 5px solid var(--gold);
            transition: 0.3s;
        }
        .card:hover { box-shadow: 0 10px 35px rgba(0,0,0,0.08); }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            border-bottom: 1px dashed #eee;
            padding-bottom: 16px;
        }
        .card-header h3 { font-size: 18px; color: #1a1a1a; font-weight: 600; display: flex; align-items: center; gap: 10px;}
        .card-header small { color: var(--muted); font-size: 13px; display: block; margin-top: 4px; }
        .card-header .amount { font-size: 22px; font-weight: 800; color: var(--gold); }
        
        .customer-info {
            display: flex;
            gap: 24px;
            font-size: 13.5px;
            color: #555;
            margin-bottom: 20px;
            background: #fdfaf5;
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid rgba(200, 169, 126, 0.2);
        }
        .customer-info span { display: flex; align-items: center; gap: 8px; font-weight: 500; }
        .customer-info i { color: var(--gold); font-size: 16px; }
        
        .items-list { list-style: none; margin-bottom: 24px; }
        .items-list li {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 14.5px;
            color: #444;
            border-bottom: 1px solid #f5f5f5;
        }
        .items-list li:last-child { border-bottom: none; }
        .items-list li span:first-child { font-weight: 500; color: #1a1a1a; }
        
        .status-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 16px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #f5f5f5;
        }
        .status-row label { font-size: 14px; font-weight: 600; color: #555; }
        
        select {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1.5px solid #ddd;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            background: #fff;
            cursor: pointer;
            transition: 0.3s;
            color: #333;
        }
        select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200, 169, 126, 0.2); }
        
        .badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;}
        .badge.Confirmed { background: #e3f2fd; color: #1976d2; }
        .badge.Preparing { background: #fff3e0; color: #f57c00; }
        .badge.Delivered { background: #e8f5e9; color: #2e7d32; }
        .badge.Cancelled { background: #ffebee; color: #c62828; }

        .loading { text-align: center; padding: 60px; font-size: 16px; color: var(--muted); }
        .loading i { font-size: 30px; color: var(--gold); animation: spin 1s linear infinite; margin-bottom: 15px; display: block;}
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        /* Mobile Responsive */
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; padding: 20px; flex-direction: row; flex-wrap: wrap; justify-content: space-between; align-items: center; }
            .sidebar h1 { margin-bottom: 0; font-size: 22px; }
            .sidebar-nav { display: flex; gap: 10px; width: 100%; margin-top: 15px; }
            .nav-item { margin-bottom: 0; padding: 10px 15px; font-size: 14px; }
            .sidebar-footer { display: none; }
            .main-content { margin-left: 0; width: 100%; padding: 20px; }
            .top-bar h2 { font-size: 24px; }
            .card-header { flex-direction: column; gap: 10px; }
            .customer-info { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h1>Mixtape Admin</h1>
        
        <div class="sidebar-nav">
            <a class="nav-item active" onclick="switchTab('orders')" id="nav-orders">
                <i class="fas fa-shopping-bag"></i> Orders
            </a>
            <a class="nav-item" onclick="switchTab('reservations')" id="nav-reservations">
                <i class="fas fa-calendar-alt"></i> Reservations
            </a>
        </div>

        <div class="sidebar-footer">
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back to Site
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        
        <div class="top-bar">
            <h2 id="page-title">Manage Orders</h2>
            <button class="refresh-btn" onclick="refreshData()">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>

        <!-- STATS (Only visible on Orders tab) -->
        <div class="stats-grid" id="stats-container">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-receipt"></i></div>
                <div class="stat-info">
                    <h3>Total Orders</h3>
                    <p id="stat-total-orders">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(46, 125, 50, 0.1); color: #2e7d32;"><i class="fas fa-rupee-sign"></i></div>
                <div class="stat-info">
                    <h3>Total Revenue</h3>
                    <p id="stat-revenue">₹0.00</p>
                </div>
            </div>
        </div>

        <!-- ORDERS TAB -->
        <div id="tab-orders" class="tab-content active">
            <div id="orders-loading" class="loading"><i class="fas fa-spinner"></i> Loading orders...</div>
            <div id="orders-list"></div>
        </div>

        <!-- RESERVATIONS TAB -->
        <div id="tab-reservations" class="tab-content">
            <div id="reservations-loading" class="loading"><i class="fas fa-spinner"></i> Loading reservations...</div>
            <div id="reservations-list"></div>
        </div>

    </main>

    <script>
        const BACKEND_URL = "https://feliciano-master.onrender.com";
        const token = localStorage.getItem("token");
        const user = JSON.parse(localStorage.getItem("user") || "null");

        // 🔒 SECURITY CHECK
        if (!token || !user || user.role !== "admin") {
            alert("Access Denied. You are not an admin.");
            window.location.href = "login.html";
        }

        // UI SWITCHING
        function switchTab(tab) {
            // Update active nav
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`nav-${tab}`).classList.add('active');
            
            // Update content
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');

            // Update title & stats
            if (tab === 'orders') {
                document.getElementById('page-title').innerText = "Manage Orders";
                document.getElementById('stats-container').style.display = "grid";
            } else {
                document.getElementById('page-title').innerText = "Table Reservations";
                document.getElementById('stats-container').style.display = "none";
            }
        }

        function refreshData() {
            if (document.getElementById('tab-orders').classList.contains('active')) {
                loadOrders();
            } else {
                loadReservations();
            }
        }

        // FETCH ORDERS
        async function loadOrders() {
            const loader = document.getElementById("orders-loading");
            loader.style.display = "block";
            document.getElementById("orders-list").innerHTML = "";

            try {
                const res = await fetch(`${BACKEND_URL}/admin/orders`, {
                    headers: { "Authorization": "Bearer " + token }
                });
                const data = await res.json();
                loader.style.display = "none";

                if (!data.orders.length) {
                    document.getElementById("orders-list").innerHTML = `<div class="loading">No orders yet.</div>`;
                    return;
                }

                // Calculate Stats
                let totalRevenue = 0;
                data.orders.forEach(o => totalRevenue += o.amount);
                document.getElementById("stat-total-orders").innerText = data.orders.length;
                document.getElementById("stat-revenue").innerText = "₹" + totalRevenue.toFixed(2);

                // Render Orders
                document.getElementById("orders-list").innerHTML = data.orders.map(order => {
                    const customer = order.userId ? `<strong>${order.userId.name}</strong> (${order.userId.email})` : "Guest User";
                    const itemsHtml = order.items.map(item => `
                        <li>
                            <span><i class="fas fa-utensils" style="color:#ccc; margin-right:8px; font-size:12px;"></i> ${item.quantity}x ${item.name}</span>
                            <span>₹${(item.price * item.quantity).toFixed(2)}</span>
                        </li>
                    `).join("");

                    return `
                        <div class="card">
                            <div class="card-header">
                                <div>
                                    <h3>Order #${order._id.slice(-6).toUpperCase()}</h3>
                                    <small><i class="far fa-clock"></i> ${new Date(order.createdAt).toLocaleString()}</small>
                                </div>
                                <div class="amount">₹${order.amount.toFixed(2)}</div>
                            </div>
                            
                            <div class="customer-info">
                                <span><i class="fas fa-user"></i> ${customer}</span>
                                <span><i class="fas fa-credit-card"></i> ${order.paymentId}</span>
                            </div>

                            <ul class="items-list">${itemsHtml}</ul>

                            <div class="status-row">
                                <label>Update Status:</label>
                                <span class="badge ${order.status || 'Confirmed'}" id="badge-${order._id}">${order.status || 'Confirmed'}</span>
                                <select onchange="updateStatus('${order._id}', this.value)">
                                    <option value="Confirmed" ${order.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                                    <option value="Preparing" ${order.status === 'Preparing' ? 'selected' : ''}>Preparing</option>
                                    <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                                    <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                                </select>
                            </div>
                        </div>
                    `;
                }).join("");
            } catch (err) {
                loader.style.display = "none";
                document.getElementById("orders-list").innerHTML = `<div class="loading" style="color:red;">Error: ${err.message}</div>`;
            }
        }

        // UPDATE STATUS
        async function updateStatus(orderId, newStatus) {
            try {
                const res = await fetch(`${BACKEND_URL}/admin/orders/${orderId}/status`, {
                    method: "PUT",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token 
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                if (res.ok) {
                    const badge = document.getElementById(`badge-${orderId}`);
                    badge.className = `badge ${newStatus}`;
                    badge.innerText = newStatus;
                } else {
                    alert("Failed to update status");
                }
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        // FETCH RESERVATIONS
        async function loadReservations() {
            const loader = document.getElementById("reservations-loading");
            loader.style.display = "block";
            document.getElementById("reservations-list").innerHTML = "";

            try {
                const res = await fetch(`${BACKEND_URL}/admin/reservations`, {
                    headers: { "Authorization": "Bearer " + token }
                });
                const data = await res.json();
                loader.style.display = "none";

                if (!data.reservations.length) {
                    document.getElementById("reservations-list").innerHTML = `<div class="loading">No reservations yet.</div>`;
                    return;
                }

                document.getElementById("reservations-list").innerHTML = data.reservations.map(rsv => `
                    <div class="card" style="border-left-color: #1976d2;">
                        <div class="card-header">
                            <div>
                                <h3><i class="fas fa-users" style="color:#1976d2; margin-right:8px;"></i> ${rsv.name} — ${rsv.persons} Guests</h3>
                                <small><i class="far fa-calendar-check"></i> Booked on: ${new Date(rsv.createdAt).toLocaleString()}</small>
                            </div>
                            <div class="amount" style="color:#1976d2; font-size:18px;">
                                <i class="far fa-calendar-alt"></i> ${rsv.date} <br> 
                                <i class="far fa-clock"></i> ${rsv.time}
                            </div>
                        </div>
                        <div class="customer-info" style="border-color: rgba(25,118,210,0.2); background:#f0f8ff;">
                            <span><i class="fas fa-envelope" style="color:#1976d2;"></i> ${rsv.email}</span>
                            <span><i class="fas fa-phone" style="color:#1976d2;"></i> ${rsv.phone}</span>
                        </div>
                    </div>
                `).join("");
            } catch (err) {
                loader.style.display = "none";
                document.getElementById("reservations-list").innerHTML = `<div class="loading" style="color:red;">Error: ${err.message}</div>`;
            }
        }

        // INIT
        if (token && user && user.role === "admin") {
            loadOrders();
            loadReservations();
        }
    </script>
</body>
</html>
