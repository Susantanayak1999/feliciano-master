<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Mixtape Kitchen</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #f8f6f3 0%, #f0ebe3 100%);
            min-height: 100vh; display: flex; align-items: center;
            justify-content: center; padding: 30px 20px; color: #333;
        }
        .card {
            background: #fff; border-radius: 20px; padding: 50px 40px;
            max-width: 560px; width: 100%; text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.08);
            border: 1px solid rgba(200,169,126,0.15);
            animation: pop 0.5s ease both;
        }
        @keyframes pop {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .check-circle {
            width: 90px; height: 90px; border-radius: 50%;
            background: linear-gradient(135deg, #c8a97e, #b18f64);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 10px 30px rgba(200,169,126,0.45);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(200,169,126,0.45); }
            50% { box-shadow: 0 10px 45px rgba(200,169,126,0.75); }
        }
        .check-circle i { color: #fff; font-size: 42px; }
        h1 {
            font-family: "Playfair Display", serif;
            font-size: 32px; margin-bottom: 8px; color: #1a1a1a;
        }
        .sub { color: #888; margin-bottom: 30px; font-size: 15px; }
        .order-box {
            background: #faf8f4; border-radius: 12px; padding: 22px 24px;
            text-align: left; margin-bottom: 28px;
            border: 1px dashed rgba(200,169,126,0.4);
        }
        .order-box .row {
            display: flex; justify-content: space-between;
            padding: 8px 0; font-size: 14px; color: #555;
            border-bottom: 1px dashed #eee;
        }
        .order-box .row:last-child { border-bottom: none; }
        .order-box .row strong { color: #1a1a1a; }
        .order-box .total {
            font-size: 18px; font-weight: 700; color: #b18f64;
            padding-top: 12px; margin-top: 8px;
            border-top: 2px solid #eee;
        }
        .order-box .pid {
            font-size: 11px; color: #999; word-break: break-all;
            font-family: monospace;
        }
        .actions {
            display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
        }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 28px; border-radius: 30px;
            font-family: "Poppins", sans-serif; font-size: 14px;
            font-weight: 500; text-decoration: none;
            transition: all 0.3s; border: none; cursor: pointer;
        }
        .btn-primary {
            background: linear-gradient(135deg, #c8a97e, #b18f64);
            color: #fff; box-shadow: 0 8px 20px rgba(200,169,126,0.4);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(200,169,126,0.55);
        }
        .btn-outline {
            border: 1.5px solid #c8a97e; color: #b18f64; background: #fff;
        }
        .btn-outline:hover { background: #c8a97e; color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <div class="check-circle"><i class="fas fa-check"></i></div>
        <h1>Order Confirmed!</h1>
        <p class="sub">Thank you for dining with Feliciano</p>
        <div class="order-box" id="orderBox"></div>
        <div class="actions">
            <a href="menu.html" class="btn btn-primary">
                <i class="fas fa-utensils"></i> Order Again
            </a>
            <a href="index.html" class="btn btn-outline">
                <i class="fas fa-home"></i> Home
            </a>
        </div>
    </div>
    <script>
        const order = JSON.parse(localStorage.getItem("lastOrder") || "null");
        if (order) {
            const date = new Date(order.date);
            const itemLines = order.items.map(i =>
                `<div class="row">
                    <span>${i.name} × ${i.quantity}</span>
                    <span>₹${(Number(i.price) * Number(i.quantity)).toFixed(2)}</span>
                </div>`
            ).join("");
            document.getElementById("orderBox").innerHTML = `
                <div class="row">
                    <span>Order Date</span>
                    <strong>${date.toLocaleString("en-IN")}</strong>
                </div>
                ${itemLines}
                <div class="row total">
                    <span>Total Paid</span>
                    <span>₹${Number(order.amount).toFixed(2)}</span>
                </div>
                <div class="row">
                    <span>Payment ID</span>
                    <span class="pid">${order.payment_id}</span>
                </div>
            `;
        } else {
            document.getElementById("orderBox").innerHTML =
                `<div class="row"><span>No recent order found.</span></div>`;
        }
    </script>
</body>
</html>
